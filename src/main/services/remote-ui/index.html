<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搬运蚁 远程控制</title>
<script>
// 跟随系统深浅色模式（在渲染前应用，避免闪烁）
(function(){
  function apply(){
    document.documentElement.classList.toggle('dark',window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  apply();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',apply);
})();
</script>
<style>
/* ── Design Tokens（与 App 端 design-tokens.css 一致） ── */
:root{
  color-scheme:light;
  --background:#fafafa;--foreground:#0a0a0a;
  --card:#ffffff;--card-foreground:#0a0a0a;
  --popover:#ffffff;--popover-foreground:#0a0a0a;
  --primary:#0d9488;--primary-hover:#0f766e;--primary-foreground:#ffffff;
  --secondary:#f5f3f0;--secondary-foreground:#1a1d23;
  --muted:#f0ede8;--muted-foreground:#78716c;
  --accent:#f0fdfa;--accent-foreground:#0d9488;
  --destructive:#dc2626;--destructive-foreground:#ffffff;
  --success:#16a34a;--success-foreground:#ffffff;
  --warning:#d97706;--warning-foreground:#ffffff;
  --destructive-bg:#fef2f2;--success-bg:#f0fdf4;--warning-bg:#fffbeb;
  --border:#e7e5e2;--input:#e7e5e2;--ring:#0d9488;
  --radius-xs:4px;--radius-sm:6px;--radius:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-md:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --shadow-lg:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.06);
  --transition-fast:120ms cubic-bezier(.4,0,.2,1);
  --transition-normal:200ms cubic-bezier(.4,0,.2,1);
  --transition-slow:300ms cubic-bezier(.4,0,.2,1);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Inter",sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --sidebar-w:220px;--header-h:48px;
}
.dark{
  color-scheme:dark;
  --background:#111113;--foreground:#fafafa;
  --card:#1a1a1e;--card-foreground:#fafafa;
  --popover:#1a1a1e;--popover-foreground:#fafafa;
  --primary:#5eead4;--primary-hover:#99f6e4;--primary-foreground:#042f2e;
  --secondary:#27272a;--secondary-foreground:#fafafa;
  --muted:#27272a;--muted-foreground:#a1a1aa;
  --accent:#134e4a;--accent-foreground:#5eead4;
  --destructive:#ef4444;--destructive-foreground:#ffffff;
  --success:#22c55e;--success-foreground:#ffffff;
  --warning:#f59e0b;--warning-foreground:#0a0a0a;
  --destructive-bg:#450a0a;--success-bg:#052e16;--warning-bg:#451a03;
  --border:#2e2e32;--input:#2e2e32;--ring:#5eead4;
  --shadow-xs:0 1px 2px rgba(0,0,0,.2);
  --shadow-sm:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
  --shadow:0 4px 6px -1px rgba(0,0,0,.35),0 2px 4px -2px rgba(0,0,0,.25);
  --shadow-md:0 10px 15px -3px rgba(0,0,0,.4),0 4px 6px -4px rgba(0,0,0,.3);
  --shadow-lg:0 20px 25px -5px rgba(0,0,0,.5),0 8px 10px -6px rgba(0,0,0,.35);
}

/* ── 基础 ── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--font-sans)}
input,textarea{font-family:var(--font-sans)}

/* ── 按钮（App 规范） ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;background:var(--secondary);color:var(--foreground);transition:all var(--transition-fast);outline:none;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary);box-shadow:var(--shadow-xs)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--foreground)}
.btn-ghost:hover{background:var(--muted);border-color:color-mix(in srgb,var(--border) 50%,var(--foreground))}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn-danger:hover{opacity:.9}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--radius-sm)}
.btn-block{width:100%;display:flex}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 输入框（App 规范） ── */
.form-input,.input-field{height:32px;width:100%;padding:0 12px;border:1px solid var(--input);border-radius:var(--radius);background:var(--card);color:var(--foreground);font-size:13px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.form-input:focus,.input-field:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 15%,transparent)}
.input-field{height:auto;resize:none;padding:8px 12px;line-height:1.4;max-height:120px}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--muted-foreground);margin-bottom:6px;letter-spacing:.5px}
.form-group{margin-bottom:var(--space-4)}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);transition:border-color var(--transition-fast)}
.section-title{font-size:16px;font-weight:600;margin-bottom:var(--space-4);padding-bottom:var(--space-2);border-bottom:1px solid var(--border)}

/* ── 徽章 / 标签 ── */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full)}
.badge-pending{background:var(--accent);color:var(--accent-foreground)}
.badge-running{background:var(--warning-bg);color:var(--warning)}
.badge-completed{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-failed{background:var(--destructive-bg);color:var(--destructive)}
.badge-checking{background:var(--warning-bg);color:var(--warning)}
.badge-ok{background:var(--success-bg);color:var(--success)}
.badge-fail{background:var(--destructive-bg);color:var(--destructive)}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--popover);border:1px solid var(--border);color:var(--foreground);padding:8px 16px;border-radius:var(--radius-lg);font-size:12px;z-index:300;box-shadow:var(--shadow-lg);animation:toast-in var(--transition-normal)}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── 对话框（App 规范） ── */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:var(--space-4)}
.dialog-overlay.show{display:flex}
.dialog{background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:380px;max-height:80vh;overflow-y:auto;padding:var(--space-5);animation:dlg-in var(--transition-normal)}
@keyframes dlg-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.dialog-title{font-size:15px;font-weight:600;margin-bottom:var(--space-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.dialog-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.dialog-item{display:flex;align-items:center;width:100%;padding:9px 12px;border:none;background:none;color:var(--foreground);font-size:13px;text-align:left;cursor:pointer;border-radius:var(--radius);transition:background var(--transition-fast)}
.dialog-item:hover{background:var(--muted)}
.dialog-item.active{background:var(--accent);color:var(--accent-foreground)}
.dialog-item .check{margin-left:auto;opacity:0;color:var(--accent-foreground)}
.dialog-item.active .check{opacity:1}
.dialog-slider{padding:var(--space-2) 0}
.dialog-slider label{display:block;font-size:12px;color:var(--muted-foreground);margin-bottom:var(--space-2)}
.dialog-slider .sv{font-size:13px;color:var(--accent-foreground);text-align:center;margin-top:var(--space-2);font-weight:500}
.dialog-close{background:none;border:none;color:var(--muted-foreground);cursor:pointer;font-size:16px;padding:4px;border-radius:var(--radius);line-height:1}
.dialog-close:hover{background:var(--muted);color:var(--foreground)}
.dialog-empty{padding:var(--space-4);text-align:center;font-size:12px;color:var(--muted-foreground)}

/* ── 布局壳 ── */
.app{display:flex;flex-direction:column;height:100vh}
.header{display:flex;align-items:center;height:var(--header-h);padding:0 var(--space-3);background:var(--card);border-bottom:1px solid var(--border);gap:var(--space-2);flex-shrink:0}
.header-logo{display:none;align-items:center;gap:8px;font-size:15px;font-weight:700;flex-shrink:0}
.header-logo .logo-dot{width:22px;height:22px;border-radius:var(--radius-sm);background:var(--primary);display:flex;align-items:center;justify-content:center}
.header-logo .logo-dot svg{width:14px;height:14px;color:var(--primary-foreground)}
.header-title{flex:1;font-size:15px;font-weight:600;text-align:center}
.header-device{font-size:12px;color:var(--accent-foreground);cursor:pointer;padding:4px 10px;border-radius:var(--radius);transition:background var(--transition-fast);display:inline-flex;align-items:center;gap:4px;flex-shrink:0}
.header-device:hover{background:var(--accent)}
.icon-btn{background:none;border:none;color:var(--foreground);cursor:pointer;padding:6px;border-radius:var(--radius);transition:background var(--transition-fast);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.app-body{flex:1;display:flex;overflow:hidden;position:relative}

/* ── 侧边栏（手机抽屉 / 桌面常驻） ── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform var(--transition-normal);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:var(--space-4);font-size:15px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sidebar-nav{flex:1;padding:var(--space-2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--radius);font-size:13px;color:var(--muted-foreground);cursor:pointer;border:none;background:none;text-align:left;transition:all var(--transition-fast);font-weight:500}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:var(--muted);color:var(--foreground)}
.nav-item.active{background:var(--accent);color:var(--accent-foreground)}
.sidebar-footer{padding:var(--space-3);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.sidebar-footer .nav-item{color:var(--destructive)}
.sidebar-version{padding:var(--space-2) var(--space-4);font-size:10px;color:var(--muted-foreground);text-align:center;border-top:1px solid var(--border)}

/* ── 内容区 ── */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.page{display:none;height:100%;overflow-y:auto;padding:var(--space-4)}
.page.active{display:block}
#page-main{display:none;flex-direction:column;padding:0;overflow:hidden}
#page-main.active{display:flex}

/* ── 连接横幅 ── */
.conn-banner{display:none;padding:6px var(--space-3);font-size:11px;text-align:center;gap:6px;align-items:center;justify-content:center;flex-shrink:0}
.conn-banner.show{display:flex}
.conn-banner.ok{background:var(--success-bg);color:var(--success)}
.conn-banner.checking,.conn-banner.retry{background:var(--warning-bg);color:var(--warning)}
.conn-banner.offline{background:var(--destructive-bg);color:var(--destructive)}
.conn-spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 主控：任务流 + 输入条 ── */
.chat{flex:1;overflow-y:auto;padding:var(--space-4);scroll-behavior:smooth}
.chat-stream{display:flex;flex-direction:column;gap:var(--space-2);max-width:860px;margin:0 auto}
.task{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-xs);transition:border-color var(--transition-fast)}
@media(min-width:768px){.task:hover{border-color:color-mix(in srgb,var(--border) 40%,var(--foreground))}}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:var(--space-2)}
.task-name{font-size:13px;font-weight:600}
.task-msg{font-size:12px;color:var(--muted-foreground);margin-bottom:var(--space-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-bar{height:4px;background:var(--muted);border-radius:2px;overflow:hidden}
.task-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width var(--transition-slow)}
.task-bar-fill.done{background:var(--success)}
.task-bar-fill.error{background:var(--destructive)}
.task-actions{display:flex;gap:var(--space-2);margin-top:var(--space-2);justify-content:flex-end}
.task-tag{font-size:10px;color:var(--muted-foreground);margin-left:6px}
.empty{text-align:center;padding:var(--space-10) var(--space-4);color:var(--muted-foreground);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:var(--space-2);opacity:.5}

/* ── 输入条 ── */
.input-bar{border-top:1px solid var(--border);padding:var(--space-2) var(--space-4) var(--space-3);background:var(--card);flex-shrink:0}
.input-row{display:flex;gap:var(--space-2);align-items:flex-end;max-width:860px;margin:0 auto}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);border:none;color:var(--primary-foreground);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all var(--transition-fast);box-shadow:var(--shadow-sm)}
.send-btn:hover{background:var(--primary-hover)}
.send-btn:active{transform:scale(.96)}
.send-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.chips{display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap;max-width:860px;margin-left:auto;margin-right:auto}
.chip{font-size:11px;padding:3px 10px;border-radius:var(--radius-full);background:var(--accent);color:var(--accent-foreground);border:none;cursor:pointer;transition:all var(--transition-fast);font-weight:500}
.chip:hover{background:color-mix(in srgb,var(--accent) 80%,var(--primary))}
.chip-spacer{flex:1}

/* ── 登录页 ── */
.login-wrap{display:flex;align-items:center;justify-content:center;height:100vh;padding:var(--space-6)}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:var(--space-8) var(--space-6);box-shadow:var(--shadow-md)}
.login-logo{width:48px;height:48px;border-radius:var(--radius-lg);background:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4)}
.login-logo svg{width:26px;height:26px;color:var(--primary-foreground)}
.login-title{text-align:center;font-size:18px;font-weight:700;margin-bottom:var(--space-1)}
.login-sub{text-align:center;font-size:13px;color:var(--muted-foreground);margin-bottom:var(--space-6)}
.login-error{color:var(--destructive);font-size:12px;text-align:center;margin-top:var(--space-2)}

/* ── 退出菜单 ── */
.exit-menu{position:fixed;top:calc(var(--header-h) + 4px);right:var(--space-2);background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-1);box-shadow:var(--shadow-md);z-index:150;display:none;min-width:160px}
.exit-menu.show{display:block}
.exit-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);font-size:13px;color:var(--foreground);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background var(--transition-fast)}
.exit-menu-item:hover{background:var(--muted)}
.exit-menu-item.danger{color:var(--destructive)}

/* ── 二维码 ── */
.qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:250;display:none;align-items:center;justify-content:center;flex-direction:column;padding:var(--space-4)}
.qr-overlay.show{display:flex}
.qr-overlay img{max-width:100%;max-height:75vh;border-radius:var(--radius);box-shadow:var(--shadow-lg)}
.qr-actions{display:flex;gap:var(--space-2);margin-top:var(--space-3)}

/* ── 平台登录 ── */
.platform-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-4);margin-bottom:var(--space-3);box-shadow:var(--shadow-xs)}
.platform-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.platform-name{font-size:14px;font-weight:600}
.platform-qr{margin-top:var(--space-3);text-align:center;min-height:0}
.platform-qr img{max-width:100%;border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;box-shadow:var(--shadow-sm)}
.qr-tip{font-size:11px;color:var(--muted-foreground);margin-top:var(--space-2)}
.login-tip{font-size:11px;color:var(--muted-foreground);text-align:center;margin-top:var(--space-2)}

/* ── 字幕页滑块 ── */
.slider-row{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.slider-label{font-size:11px;color:var(--muted-foreground);width:32px;flex-shrink:0}
.slider-val{font-size:11px;color:var(--muted-foreground);width:36px;text-align:right;flex-shrink:0}
.slider-h::-webkit-slider-thumb{background:hsl(var(--h,30),100%,50%)!important}
.slider-s::-webkit-slider-thumb{background:hsl(var(--h,30),var(--s,100)%,50%)!important}

/* ── 字幕调色盘 ── */
.palette-preview{width:100%;height:32px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:var(--space-3);box-shadow:var(--shadow-xs);transition:background var(--transition-fast)}
.palette-swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--space-2);margin-bottom:var(--space-3)}
.palette-swatches .swatch{width:100%;aspect-ratio:1;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--border) 60%,transparent);cursor:pointer;padding:0;transition:transform var(--transition-fast),box-shadow var(--transition-fast);outline:none}
.palette-swatches .swatch:hover{transform:scale(1.1);box-shadow:var(--shadow-sm)}
.palette-swatches .swatch:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.palette-swatches .swatch.active{outline:2px solid var(--ring);outline-offset:2px;transform:scale(1.1)}
.palette-row{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2)}
.palette-row input[type=color]{width:40px;height:28px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);cursor:pointer;padding:2px}
.palette-row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.palette-row input[type=color]::-webkit-color-swatch{border:none;border-radius:var(--radius-sm)}
.palette-hex{font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)}
.palette-tip{font-size:11px;color:var(--muted-foreground);margin-left:auto}
.palette-advanced{margin-bottom:var(--space-3)}
.palette-advanced summary{font-size:11px;color:var(--muted-foreground);cursor:pointer;margin-bottom:var(--space-2);user-select:none}
.palette-advanced summary:hover{color:var(--foreground)}

/* ── 状态页 ── */
.status-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)}
.status-time{font-size:11px;color:var(--muted-foreground)}
.status-grid{display:grid;grid-template-columns:1fr;gap:var(--space-2);margin-bottom:var(--space-5)}
.status-item{display:flex;align-items:center;gap:var(--space-3);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-3) var(--space-4);box-shadow:var(--shadow-xs);min-width:0}
.status-item-body{flex:1;min-width:0}
.status-item-name{font-size:13px;font-weight:500}
.status-item-url{font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:var(--radius-full);flex-shrink:0}
.status-dot.ok{background:var(--success)}
.status-dot.fail{background:var(--destructive)}
.status-bar{width:64px;height:6px;border-radius:var(--radius-full);background:var(--muted);overflow:hidden;flex-shrink:0}
.status-bar-fill{height:100%;border-radius:var(--radius-full);background:var(--success);transition:width var(--transition-normal)}
.status-bar-fill.over{background:var(--destructive)}
.status-queue-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);padding:var(--space-3)}
.status-queue-item{text-align:center}
.status-queue-num{font-size:20px;font-weight:700;color:var(--accent-foreground)}
.status-queue-label{font-size:11px;color:var(--muted-foreground);margin-top:var(--space-1)}
@media(min-width:768px){
  .status-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── 响应式：桌面（≥768px） ── */
@media(min-width:768px){
  .header{height:var(--header-h);padding:0 var(--space-4)}
  .header-logo{display:flex}
  .header-title{text-align:left;font-size:14px;font-weight:500;color:var(--muted-foreground)}
  .sidebar{position:relative;transform:none;width:var(--sidebar-w);border-right:1px solid var(--border);z-index:auto}
  .sidebar.open{transform:none}
  .sidebar-overlay{display:none!important}
  #sidebar-toggle{display:none}
  .content{background:var(--background)}
  .chat{padding:var(--space-5)}
  .input-bar{padding:var(--space-3) var(--space-5)}
}

</head>
<body>
<div id="app"></div>
<script>
const HUB_URL='https://hub.onebugmanai.online';
let API=window.location.origin;
let token=localStorage.getItem('antbot-token');
let tasks=[];
let historyItems=[];
let sseSource=null;
let currentPage='main';
let deviceId=localStorage.getItem('antbot-device-id')||'';
let deviceName=localStorage.getItem('antbot-device')||'';
let consecutiveErrors=0;
let reconnectTimer=null;

// 从 URL 参数获取 Hub 传递的 token 和设备标识
const urlParams=new URLSearchParams(window.location.search);
const hubToken=urlParams.get('hub_token');
const hubDeviceId=urlParams.get('device_id');
const hubDevice=urlParams.get('device_name');
if(hubToken){
  token=hubToken;
  localStorage.setItem('antbot-token',token);
  if(hubDeviceId){deviceId=hubDeviceId;localStorage.setItem('antbot-device-id',deviceId);}
  if(hubDevice){deviceName=hubDevice;localStorage.setItem('antbot-device',deviceName);}
  // 清除 URL 参数
  window.history.replaceState({},'',window.location.pathname);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function login(password){
  try{
    const res=await fetch(API+'/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});
    const data=await res.json();
    if(data.ok){
      token=data.token;
      localStorage.setItem('antbot-token',token);
      initApp();
    }else{showToast(data.error||'登录失败')}
  }catch(e){showToast('网络错误')}
}

function logout(){
  token=null;
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  renderLogin();
}

function exitToHub(){
  token=null;
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  localStorage.removeItem('antbot-device');
  localStorage.removeItem('antbot-device-id');
  window.location.href=HUB_URL;
}

async function api(method,path,body){
  const opts={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(API+path,opts);
  if(res.status===401){logout();return null;}
  return res.json();
}

function showToast(msg,dur){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),dur||3000);
}

function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null;}
  sseSource=new EventSource(API+'/remote/events?token='+token);
  sseSource.onopen=()=>{consecutiveErrors=0;hideBanner()};
  sseSource.addEventListener('task-update',e=>{
    const t=JSON.parse(e.data);const i=tasks.findIndex(x=>x.id===t.id);
    if(i>=0)tasks[i]={...tasks[i],...t};else tasks.push(t);
    renderTasks();
  });
  sseSource.addEventListener('status',e=>{
    const s=JSON.parse(e.data);
    if(s.tasks){tasks=s.tasks;renderTasks();}
  });
  sseSource.addEventListener('settings-update',e=>{
    const patch=JSON.parse(e.data);
    if(currentSettings){
      if(patch.editDefaults)currentSettings.editDefaults={...currentSettings.editDefaults,...patch.editDefaults};
      if(patch.voiceClone)currentSettings.voiceClone={...currentSettings.voiceClone,...patch.voiceClone};
      if(patch.retry)currentSettings.retry={...currentSettings.retry,...patch.retry};
      renderChips(currentSettings);
    }
  });
  sseSource.onerror=()=>{
    consecutiveErrors++;
    if(consecutiveErrors>=3){showBanner('retry');reconnectViaHub();}
    else if(consecutiveErrors>=1){showBanner('checking')}
  };
}

async function reconnectViaHub(){
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(!deviceId)return;
  try{
    const res=await fetch(HUB_URL+'/api/devices');
    const data=await res.json();
    if(data.ok){
      const dev=data.devices.find(d=>d.deviceId===deviceId);
      if(dev&&dev.tunnelUrl&&dev.tunnelUrl!==API){
        showBanner('newurl');API=dev.tunnelUrl;
        setTimeout(()=>{const sep=API.includes('?')?'&':'?';window.location.href=API+sep+'hub_token='+(token||'')+'&device_id='+encodeURIComponent(deviceId)+'&device_name='+encodeURIComponent(deviceName)},1500);
        return;
      }
    }
  }catch{}
  showBanner('offline');
  reconnectTimer=setTimeout(reconnectViaHub,15000);
}

function showBanner(st){
  const b=document.getElementById('conn-banner');if(!b)return;
  b.className='conn-banner show '+st;
  const t=document.getElementById('conn-text');
  const msgs={checking:'连接中断，正在检查...',retry:'连接中断，重连中...',newurl:'服务器已更新，正在跳转...',offline:'电脑可能已离线'};
  if(t)t.textContent=msgs[st]||'正在连接...';
}
function hideBanner(){const b=document.getElementById('conn-banner');if(b){b.className='conn-banner show ok';const t=document.getElementById('conn-text');if(t)t.textContent='已连接';setTimeout(()=>{b.className='conn-banner'},2000);}}

function renderLogin(){
  document.getElementById('app').innerHTML=
    '<div class="login-wrap">'+
    '<div class="login-card">'+
    '<div class="login-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="8" r="4"/><line x1="10" y1="12" x2="10" y2="20"/><line x1="4" y1="16" x2="10" y2="16"/><line x1="12" y1="4" x2="16" y2="4"/></svg></div>'+
    '<div class="login-title">搬运蚁远程控制</div>'+
    '<div class="login-sub">'+(deviceName?esc(deviceName):'输入密码连接到设备')+'</div>'+
    '<form id="login-form">'+
    '<div class="form-group"><input class="form-input" id="login-pass" type="password" placeholder="访问密码" autocomplete="current-password"></div>'+
    '<button class="btn btn-primary btn-block" type="submit">连接</button>'+
    '</form><div class="login-error" id="login-error"></div>'+
    '</div></div>';
  document.getElementById('login-form').addEventListener('submit',e=>{
    e.preventDefault();
    const p=document.getElementById('login-pass').value.trim();
    if(!p){document.getElementById('login-error').textContent='请输入密码';return;}
    login(p);
  });
  document.getElementById('login-pass')?.focus();
}

function initApp(){
  document.getElementById('app').innerHTML=renderAppShell();
  bindEvents();
  loadSettings();
  loadTasks();
  connectSSE();

function bindEvents(){
  document.getElementById('header-device')?.addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('exit-menu')?.classList.toggle('show');
  });
  document.addEventListener('click',()=>{
    document.getElementById('exit-menu')?.classList.remove('show');
  });
  document.getElementById('exit-btn')?.addEventListener('click',exitToHub);

  document.getElementById('sidebar-toggle')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('show');
  });
  document.getElementById('sidebar-overlay')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  });
  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.addEventListener('click',()=>switchPage(btn.dataset.page));
  });
  const input=document.getElementById('task-input');
  const sendBtn=document.getElementById('send-btn');
  if(input){
    if(sendBtn)sendBtn.disabled=!input.value.trim();
    input.addEventListener('input',()=>{
      input.style.height='auto';
      input.style.height=Math.min(input.scrollHeight,120)+'px';
      if(sendBtn)sendBtn.disabled=!input.value.trim();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask();}});
  }
  if(sendBtn)sendBtn.addEventListener('click',sendTask);
  document.getElementById('chat-stream')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn)return;
    if(btn.dataset.action==='stop')api('POST','/remote/tasks/'+btn.dataset.id+'/stop').then(()=>showToast('已停止'));
    if(btn.dataset.action==='retry')api('POST','/remote/tasks/'+btn.dataset.id+'/retry').then(()=>showToast('已重试'));
  });
  document.getElementById('sub-save-btn')?.addEventListener('click',async()=>{
    await api('POST','/remote/settings',{style:{subtitleTextColor:getColorHex('color'),subtitleStrokeColor:getColorHex('stroke'),subtitlePositionPercent:parseInt(document.getElementById('sub-position')?.value)||12}});
    showToast('已保存并同步');
  });
  document.getElementById('remote-save-btn')?.addEventListener('click',async()=>{
    const p=document.getElementById('remote-pass')?.value?.trim();
    if(!p){showToast('请设置密码');return;}
    await api('POST','/remote/settings',{remote:{password:p}});
    showToast('已保存，需重新登录');setTimeout(logout,1000);
  });
  document.querySelectorAll('.login-check-btn').forEach(btn=>{
    btn.addEventListener('click',()=>checkPlatformLogin(btn.dataset.platform));
  });
  document.getElementById('qr-overlay')?.addEventListener('click',e=>{if(e.target.id==='qr-overlay')hideQrOverlay();});
  document.getElementById('qr-close-btn')?.addEventListener('click',hideQrOverlay);
  document.getElementById('qr-save-btn')?.addEventListener('click',()=>{const img=document.getElementById('qr-overlay-img');if(img?.src)saveQrImage(img.src);});
  setupColorPicker('color','#FFA100');
  setupColorPicker('stroke','#000000');
}

function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.getElementById('header-title').textContent={main:'主控',subtitle:'字幕',remote:'远程',login:'平台登录',status:'状态'}[page]||'主控';
  // 桌面侧边栏常驻不关闭；手机抽屉切换后关闭
  if(window.innerWidth<768){
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  }
  const ib=document.getElementById('input-bar');if(ib)ib.style.display=page==='main'?'':'none';
  if(page==='subtitle')loadSubtitleSettings();
  if(page==='remote')loadRemoteSettings();
  if(page==='status')loadSystemStatus();
}

// ── 对话框（风格/音色/重试） ──
let activeDialog=null;
function openDialog(title,contentHtml){
  closeDialog();
  const overlay=document.createElement('div');overlay.className='dialog-overlay show';
  overlay.innerHTML='<div class="dialog"><div class="dialog-title"><span>'+esc(title)+'</span><button class="dialog-close" type="button">✕</button></div>'+contentHtml+'</div>';
  overlay.addEventListener('click',e=>{if(e.target===overlay)closeDialog();});

function renderChips(s){

      const voices=d?.voices||[];

      const body=dlg.querySelector('.dialog');body.replaceChild(list,body.querySelector('.dialog-list,.dialog-empty'));
      list.querySelectorAll('.dialog-item').forEach(btn=>{
        btn.addEventListener('click',async()=>{
          const vname=btn.dataset.vname;
          await api('POST','/remote/settings',{editDefaults:{...currentSettings?.editDefaults,voice:vname}});
          currentSettings.editDefaults={...currentSettings?.editDefaults,voice:vname};
          renderChips(currentSettings);closeDialog();showToast('音色: '+vname);
        });
      });
    });
    return;
  }
  if(type==='retry'){
    const cur=Math.max(0,Number(currentSettings?.retry?.failedTaskRetries??0));
    const dlg=openDialog('失败重试','<div class="dialog-slider"><label>重试次数</label><input type="range" min="0" max="4" step="1" value="'+cur+'"><div class="sv">'+(cur===0?'不重试':cur+'次')+'</div></div>');
    const range=dlg.querySelector('input[type=range]');
    const val=dlg.querySelector('.sv');
    range.addEventListener('input',()=>{const v=Number(range.value);val.textContent=v===0?'不重试':v+'次'});

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function hexToHsl(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];const r=parseInt(hex.substring(0,2),16)/255,g=parseInt(hex.substring(2,4),16)/255,b=parseInt(hex.substring(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))/6;else if(mx===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
const PALETTE_COLORS=['#FFA100','#FF3B30','#FF9500','#FFCC00','#34C759','#00C7BE','#32ADE6','#007AFF','#5856D6','#AF52DE','#FF2D55','#8E8E93','#3A3A3C','#FFFFFF','#000000'];
function getColorHex(p){
  const native=document.getElementById(p+'-native');
  if(native&&native.value)return native.value;
  const h=parseInt(document.getElementById(p+'-h')?.value||0),s=parseInt(document.getElementById(p+'-s')?.value||0),l=parseInt(document.getElementById(p+'-l')?.value||50);return hslToHex(h,s,l)
}
function setColorFromHex(p,hex){
  if(!hex)hex='#000000';
  const native=document.getElementById(p+'-native');if(native)native.value=hex;
  const hexEl=document.getElementById(p+'-hex');if(hexEl)hexEl.textContent=hex;
  const c=hexToHsl(hex);['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el){el.value=c[t];const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=c[t]+(t==='h'?'°':'%')}});
  updatePreview(p);
  const sw=document.querySelectorAll('#'+p+'-swatches .swatch');
  sw.forEach(s=>s.classList.toggle('active',(s.dataset.color||'').toLowerCase()===hex.toLowerCase()));
}

    sw.querySelectorAll('.swatch').forEach(b=>{

    });
  }
  const native=document.getElementById(p+'-native');

  ['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el)el.addEventListener('input',()=>{
    const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=el.value+(t==='h'?'°':'%');
    const hex=hslToHex(parseInt(document.getElementById(p+'-h')?.value||0),parseInt(document.getElementById(p+'-s')?.value||0),parseInt(document.getElementById(p+'-l')?.value||50));
    const native=document.getElementById(p+'-native');if(native)native.value=hex;

    updatePreview(p);
    const sw=document.querySelectorAll('#'+p+'-swatches .swatch');

async function loadTasks(){
  const d=await api('GET','/remote/tasks');if(d?.tasks)tasks=d.tasks;
  try{
    const h=await api('GET','/remote/history');
    const merged=[];
    if(h?.history)for(const r of h.history)if(r.items)for(const i of r.items){
      const id=i.taskId||i.id;
      if(!id)continue;
      merged.push({...i,id,history:true});
    }
    // 按 id 去重（历史记录可能跨批次重复）
    const seen=new Set();
    historyItems=merged.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true});
  }catch{}
  renderTasks();
}

async function sendTask(){
  const input=document.getElementById('task-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  input.disabled=true;const btn=document.getElementById('send-btn');if(btn)btn.disabled=true;
  try{const d=await api('POST','/remote/tasks',{text});if(d?.ok){showToast('已添加 '+(d.tasks?.length||0)+' 个任务');input.value='';input.style.height='auto'}else showToast(d?.error||'发送失败')}catch{showToast('网络错误')}
  input.disabled=false;if(btn)btn.disabled=false;input.focus();
}

function renderTasks(){
  const el=document.getElementById('chat-stream'),empty=document.getElementById('empty-state');
  if(!el)return;
  // 历史项排除当前仍存活的 live 任务（同 id）
  const liveIds=new Set(tasks.map(t=>t.id));
  const hist=historyItems.filter(i=>!liveIds.has(i.id));
  if(!tasks.length&&!hist.length){if(empty)empty.style.display='';return}
  if(empty)empty.style.display='none';
  // live 任务按队列顺序在前，历史记录按时间倒序在后
  const sorted=[
    ...tasks.slice().sort((a,b)=>(a.index||a.queueIndex||0)-(b.index||b.queueIndex||0)),
    ...hist.slice().sort((a,b)=>(b.submittedAt||b.endedAt||0)-(a.submittedAt||a.endedAt||0))
  ];
  el.innerHTML=sorted.map(t=>{
    const st=t.status||'pending',pg=Math.max(0,Math.min(100,Number(t.progress||0)));
    const idx=t.index||t.queueIndex||0;
    const name=idx?'任务'+idx:(t.taskName||'任务');
    const bc={running:'badge-running',completed:'badge-completed',warning:'badge-warning',failed:'badge-failed'}[st]||'badge-pending';
    const bt={pending:'等待',queued:'等待',running:'执行中',completed:'成功',warning:'部分完成',failed:'失败',stopped:'已停止'}[st]||st;
    // 历史任务没有实时进度：终态直接显示满条
    const pct=t.history?(st==='failed'||st==='completed'?100:0):pg;
    const barC=st==='completed'?'done':st==='failed'?'error':'';
    const msg=t.message||(t.rawLine?t.rawLine.slice(0,60):'');
    let acts='';
    if(!t.history&&st==='failed')acts+='<button class="btn btn-ghost btn-sm" data-action="retry" data-id="'+t.id+'">重试</button>';
    if(!t.history&&['pending','queued','running'].includes(st))acts+='<button class="btn btn-ghost btn-sm" data-action="stop" data-id="'+t.id+'">停止</button>';
    return '<div class="task"><div class="task-head"><span class="task-name">'+esc(name)+(t.history?'<span class="task-tag">历史</span>':'')+'</span><span class="badge '+bc+'">'+bt+'</span></div>'+
      (msg?'<div class="task-msg">'+esc(msg)+'</div>':'')+
      '<div class="task-bar"><div class="task-bar-fill '+barC+'" style="width:'+pct+'%"></div></div>'+
      (acts?'<div class="task-actions">'+acts+'</div>':'')+'</div>';
  }).join('');
  const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;
}

// ── Init ──
if(token){initApp()}else{renderLogin()}
</script>
</body></html>
