<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>搬运蚁 - 远程控制</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FAFAFA;--card:#FFF;--text:#0A0A0A;--muted:#78716C;--border:#E7E5E2;--primary:#0D9488;--primary-hover:#0F766E;--primary-fg:#FFF;--accent:#F0FDFA;--accent-fg:#0D9488;--destructive:#DC2626;--success:#16A34A;--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#09090B;--card:#111113;--text:#FAFAFA;--muted:#A1A1AA;--border:#27272A;--primary:#5EEAD4;--primary-hover:#99F6E4;--primary-fg:#042F2E;--accent:#134E4A;--accent-fg:#5EEAD4;--shadow:0 1px 3px rgba(0,0,0,.3)}}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden;height:100vh;height:100dvh}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;height:48px;z-index:20}
.header-title{flex:1;font-size:16px;font-weight:700}
.header-user{font-size:12px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:var(--radius)}
.header-user:hover{color:var(--text);background:var(--muted)}
.conn-banner{display:none;align-items:center;gap:8px;padding:6px 12px;font-size:12px;font-weight:500;flex-shrink:0}
.conn-banner.show{display:flex}
.conn-banner.checking,.conn-banner.retry{background:#FEF3C7;color:#92400E}
.conn-banner.offline{background:#FEE2E2;color:#991B1B}
.conn-banner.ok{background:#DCFCE7;color:#166534}
.conn-spinner{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:30}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--border);z-index:31;transform:translateX(-100%);transition:transform 200ms;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border);font-size:16px;font-weight:700}
.sidebar-nav{padding:8px;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:var(--radius);font-size:14px;color:var(--text);background:none;border:none;cursor:pointer;transition:background 120ms}
.nav-item:hover{background:var(--accent)}
.nav-item.active{background:var(--accent);color:var(--accent-fg);font-weight:600}
.nav-icon{width:18px;height:18px;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.content{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;flex:1;min-height:0;overflow-y:auto;padding:12px}
.page.active{display:flex;flex-direction:column}
.chat{flex:1;min-height:0;overflow-y:auto;padding:12px}
.chat-stream{display:flex;flex-direction:column;gap:8px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:8px}
.empty-icon{font-size:32px;opacity:.4}
.task{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;box-shadow:var(--shadow);max-width:100%}
.task-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.task-name{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;flex-shrink:0}
.badge-running{background:var(--accent);color:var(--accent-fg)}
.badge-completed{background:#DCFCE7;color:var(--success)}
.badge-failed{background:#FEE2E2;color:var(--destructive)}
.badge-warning{background:#FEF3C7;color:#D97706}
.badge-pending{background:var(--muted);color:var(--bg)}
.task-msg{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-bar{height:3px;background:var(--border);border-radius:999px;margin-top:6px;overflow:hidden}
.task-bar-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .3s}
.task-bar-fill.done{background:var(--success)}
.task-bar-fill.error{background:var(--destructive)}
.task-actions{display:flex;gap:6px;margin-top:6px}
.input-bar{background:var(--card);border-top:1px solid var(--border);padding:8px 12px;flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-field{flex:1;min-height:36px;max-height:120px;padding:8px 12px;border:1px solid var(--border);border-radius:18px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit;line-height:1.4;resize:none;outline:none}
.input-field::placeholder{color:var(--muted)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-fg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 120ms}
.send-btn:hover{background:var(--primary-hover)}
.send-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;opacity:.6}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;font-size:11px;background:var(--muted);color:var(--text)}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.form-input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--primary)}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;margin-top:16px}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.slider-label{font-size:11px;color:var(--muted);width:28px;flex-shrink:0}
.slider-val{font-size:11px;color:var(--muted);width:36px;text-align:right;flex-shrink:0}
input[type=range]{flex:1;height:6px;-webkit-appearance:none;appearance:none;border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--card);border:2px solid var(--border);cursor:pointer;box-shadow:var(--shadow)}
.slider-h{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.slider-s{background:linear-gradient(to right,#888,var(--primary))}
.slider-l{background:linear-gradient(to right,#000,#888,#fff)}
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.dialog-overlay.show{display:flex}
.dialog{background:var(--card);border-radius:var(--radius-lg);padding:20px;max-width:320px;width:90%;box-shadow:var(--shadow)}
.dialog-title{font-size:16px;font-weight:600;margin-bottom:8px}
.dialog-text{font-size:13px;color:var(--muted);margin-bottom:16px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:var(--radius);font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all 120ms}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--muted)}
.btn-block{width:100%}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 16px;font-size:13px;box-shadow:var(--shadow);z-index:200;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const HUB_URL='https://hub.onebugmanai.online';
let API=window.location.origin;
let token=localStorage.getItem('antbot-token');
let tasks=[];
let sseSource=null;
let currentPage='main';
let currentUser=localStorage.getItem('antbot-user')||'';
let userPassword=localStorage.getItem('antbot-pass')||'';
let consecutiveErrors=0;
let reconnectTimer=null;

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function login(username,password){
  try{
    const res=await fetch(API+'/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.ok){
      token=data.token;currentUser=username;userPassword=password;
      localStorage.setItem('antbot-token',token);
      localStorage.setItem('antbot-user',username);
      localStorage.setItem('antbot-pass',password);
      initApp();
    }else{showToast(data.error||'登录失败')}
  }catch(e){showToast('网络错误')}
}

function logout(){
  token=null;currentUser='';userPassword='';
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  localStorage.removeItem('antbot-user');
  localStorage.removeItem('antbot-pass');
  renderLogin();
}

async function api(method,path,body){
  const opts={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(API+'/remote'+path,opts);
  if(res.status===401){logout();return null;}
  return res.json();
}

function showToast(msg,dur){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),dur||3000);
}

function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null;}
  sseSource=new EventSource(API+'/remote/events?token='+token);
  sseSource.onopen=()=>{consecutiveErrors=0;hideBanner()};
  sseSource.addEventListener('task-update',e=>{
    const t=JSON.parse(e.data);const i=tasks.findIndex(x=>x.id===t.id);
    if(i>=0)tasks[i]={...tasks[i],...t};else tasks.push(t);
    renderTasks();
  });
  sseSource.addEventListener('status',e=>{const d=JSON.parse(e.data);tasks=d.tasks||[];renderTasks();});
  sseSource.addEventListener('settings-update',e=>{
    try{
      const d=JSON.parse(e.data);
      if(d?.style){
        if(d.style.subtitleTextColor)setColorFromHex('color',d.style.subtitleTextColor);
        if(d.style.subtitleStrokeColor)setColorFromHex('stroke',d.style.subtitleStrokeColor);
        if(d.style.subtitlePositionPercent!=null){const el=document.getElementById('sub-position');if(el)el.value=d.style.subtitlePositionPercent;}
      }
      if(d?.editDefaults||d?.voiceClone||d?.retry)loadSettings();
      showToast('设置已同步');
    }catch{}
  });
  sseSource.onerror=()=>{
    consecutiveErrors++;sseSource.close();sseSource=null;
    if(consecutiveErrors>=3){showBanner('checking');reconnectViaHub();}
    else{showBanner('retry');reconnectTimer=setTimeout(connectSSE,Math.min(consecutiveErrors*2000,10000));}
  };
}

async function reconnectViaHub(){
  try{
    const res=await fetch(HUB_URL+'/api/tunnel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser,password:userPassword})});
    const d=await res.json();
    if(d.ok&&d.tunnelUrl){
      const newApi=d.tunnelUrl.replace(/\/$/,'');
      if(newApi!==API){
        showBanner('newurl');
        const lr=await fetch(newApi+'/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser,password:userPassword})});
        const ld=await lr.json();
        if(ld.ok){token=ld.token;localStorage.setItem('antbot-token',token);window.location.href=newApi;return;}
      }
      showBanner('retry');reconnectTimer=setTimeout(connectSSE,3000);
    }else showBanner('offline');
  }catch{showBanner('offline')}
}

function showBanner(st){
  const b=document.getElementById('conn-banner');if(!b)return;
  b.className='conn-banner show '+st;
  const t=document.getElementById('conn-text');
  const msgs={checking:'连接中断，正在检查...',retry:'连接中断，重连中...',newurl:'服务器已更新，正在跳转...',offline:'电脑可能已离线'};
  if(t)t.textContent=msgs[st]||'正在连接...';
}
function hideBanner(){const b=document.getElementById('conn-banner');if(b){b.className='conn-banner show ok';const t=document.getElementById('conn-text');if(t)t.textContent='已连接';setTimeout(()=>{b.className='conn-banner'},2000);}}

function renderLogin(){
  document.getElementById('app').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:24px">'+
    '<div style="width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;box-shadow:var(--shadow)">'+
    '<div style="text-align:center;font-size:32px;margin-bottom:16px">🐜</div>'+
    '<div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:4px">搬运蚁远程控制</div>'+
    '<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:24px">输入账号密码连接到你的电脑</div>'+
    '<form id="login-form">'+
    '<div style="margin-bottom:12px"><input class="form-input" id="login-user" type="text" placeholder="用户名" autocomplete="username" style="width:100%"></div>'+
    '<div style="margin-bottom:16px"><input class="form-input" id="login-pass" type="password" placeholder="密码" autocomplete="current-password" style="width:100%"></div>'+
    '<button class="btn btn-primary btn-block" type="submit">登录</button>'+
    '</form><div id="login-error" style="color:var(--destructive);font-size:12px;text-align:center;margin-top:8px"></div>'+
    '</div></div>';
  document.getElementById('login-form').addEventListener('submit',e=>{
    e.preventDefault();
    const u=document.getElementById('login-user').value.trim();
    const p=document.getElementById('login-pass').value.trim();
    if(!u||!p){document.getElementById('login-error').textContent='请输入用户名和密码';return;}
    login(u,p);
  });
}

function initApp(){
  document.getElementById('app').innerHTML=renderAppShell();
  bindEvents();
  loadSettings();
  loadTasks();
  connectSSE();
}

function renderAppShell(){
  const h=`
<div class="header">
  <button class="nav-item" id="sidebar-toggle" style="width:auto;padding:6px;flex-shrink:0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg></button>
  <span class="header-title" id="header-title">主控</span>
  <span class="header-user" id="header-user">${esc(currentUser)}</span>
</div>
<div class="conn-banner" id="conn-banner"><span class="conn-spinner"></span><span id="conn-text"></span></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">🐜 搬运蚁</div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-page="main"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>主控</button>
    <button class="nav-item" data-page="subtitle"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>字幕</button>
    <button class="nav-item" data-page="remote"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>远程</button>
  </nav>
</div>
<div class="content" id="content">
  <div class="page active" id="page-main">
    <div class="chat" id="chat"><div class="chat-stream" id="chat-stream"><div class="empty" id="empty-state"><div class="empty-icon">📋</div><div>粘贴视频链接开始下载</div></div></div></div>
  </div>
  <div class="page" id="page-subtitle">
    <div class="form-group"><label class="form-label">字幕颜色</label>
      <div style="width:100%;height:28px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px" id="color-preview"></div>
      <div class="slider-row"><span class="slider-label">色相</span><input type="range" id="color-h" min="0" max="360" value="30" class="slider-h"><span class="slider-val" id="color-h-val">30°</span></div>
      <div class="slider-row"><span class="slider-label">饱和</span><input type="range" id="color-s" min="0" max="100" value="100" class="slider-s"><span class="slider-val" id="color-s-val">100%</span></div>
      <div class="slider-row"><span class="slider-label">亮度</span><input type="range" id="color-l" min="0" max="100" value="50" class="slider-l"><span class="slider-val" id="color-l-val">50%</span></div>
    </div>
    <div class="form-group"><label class="form-label">描边颜色</label>
      <div style="width:100%;height:28px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px" id="stroke-preview"></div>
      <div class="slider-row"><span class="slider-label">色相</span><input type="range" id="stroke-h" min="0" max="360" value="0" class="slider-h"><span class="slider-val" id="stroke-h-val">0°</span></div>
      <div class="slider-row"><span class="slider-label">饱和</span><input type="range" id="stroke-s" min="0" max="100" value="0" class="slider-s"><span class="slider-val" id="stroke-s-val">0%</span></div>
      <div class="slider-row"><span class="slider-label">亮度</span><input type="range" id="stroke-l" min="0" max="100" value="0" class="slider-l"><span class="slider-val" id="stroke-l-val">0%</span></div>
    </div>
    <div class="form-group"><label class="form-label">字幕位置 (0-100)</label><input class="form-input" id="sub-position" type="number" min="0" max="100" value="12" /></div>
    <button class="btn btn-primary btn-block" id="sub-save-btn" type="button">保存设置</button>
  </div>
  <div class="page" id="page-remote">
    <div class="section-title">远程设置</div>
    <div class="form-group"><label class="form-label">用户名</label><input class="form-input" id="remote-user" type="text" /></div>
    <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="remote-pass" type="password" /></div>
    <button class="btn btn-primary btn-block" id="remote-save-btn" type="button">保存并重新登录</button>
  </div>
</div>
<div class="input-bar" id="input-bar">
  <div class="input-row">
    <textarea class="input-field" id="task-input" placeholder="粘贴视频链接..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" type="button" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="dialog-overlay" id="logout-dialog">
  <div class="dialog">
    <div class="dialog-title">退出登录</div>
    <div class="dialog-text">确认退出当前账号？</div>
    <div class="dialog-actions"><button class="btn btn-ghost" id="logout-cancel">取消</button><button class="btn btn-primary" id="logout-confirm">确认退出</button></div>
  </div>
</div>`;
  return h;
}

function bindEvents(){
  document.getElementById('sidebar-toggle')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('show');
  });
  document.getElementById('sidebar-overlay')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  });
  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.addEventListener('click',()=>switchPage(btn.dataset.page));
  });
  document.getElementById('header-user')?.addEventListener('click',()=>{
    document.getElementById('logout-dialog')?.classList.add('show');
  });
  document.getElementById('logout-cancel')?.addEventListener('click',()=>{
    document.getElementById('logout-dialog')?.classList.remove('show');
  });
  document.getElementById('logout-confirm')?.addEventListener('click',()=>{
    document.getElementById('logout-dialog')?.classList.remove('show');
    logout();
  });
  const input=document.getElementById('task-input');
  const sendBtn=document.getElementById('send-btn');
  if(input){
    if(sendBtn)sendBtn.disabled=!input.value.trim();
    input.addEventListener('input',()=>{
      input.style.height='auto';
      input.style.height=Math.min(input.scrollHeight,120)+'px';
      if(sendBtn)sendBtn.disabled=!input.value.trim();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask();}});
  }
  if(sendBtn)sendBtn.addEventListener('click',sendTask);
  document.getElementById('chat-stream')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn)return;
    if(btn.dataset.action==='stop')api('POST','/tasks/'+btn.dataset.id+'/stop').then(()=>showToast('已停止'));
    if(btn.dataset.action==='retry')api('POST','/tasks/'+btn.dataset.id+'/retry').then(()=>showToast('已重试'));
  });
  document.getElementById('sub-save-btn')?.addEventListener('click',async()=>{
    await api('POST','/remote/settings',{style:{subtitleTextColor:getColorHex('color'),subtitleStrokeColor:getColorHex('stroke'),subtitlePositionPercent:parseInt(document.getElementById('sub-position')?.value)||12}});
    showToast('已保存并同步');
  });
  document.getElementById('remote-save-btn')?.addEventListener('click',async()=>{
    const u=document.getElementById('remote-user')?.value?.trim();
    const p=document.getElementById('remote-pass')?.value?.trim();
    if(!p){showToast('请设置密码');return;}
    await api('POST','/remote/settings',{remote:{username:u,password:p}});
    showToast('已保存，需重新登录');setTimeout(logout,1000);
  });
  setupColorPicker('color','#FFA100');
  setupColorPicker('stroke','#000000');
}

function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.getElementById('header-title').textContent={main:'主控',subtitle:'字幕',remote:'远程'}[page]||'主控';
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('show');
  const ib=document.getElementById('input-bar');if(ib)ib.style.display=page==='main'?'':'none';
  if(page==='subtitle')loadSubtitleSettings();
  if(page==='remote')loadRemoteSettings();
}

async function loadSettings(){const d=await api('GET','/remote/settings');if(d)renderChips(d);}
function renderChips(s){
  const c=document.getElementById('chips');if(!c)return;
  c.innerHTML='<span class="chip">'+esc(s?.editDefaults?.style||'未设置')+'</span><span class="chip">'+esc(s?.voiceClone?.profileName||'未设置')+'</span><span class="chip">重试'+(s?.retry?.failedTaskRetries??0)+'次</span>';
}
async function loadSubtitleSettings(){
  const d=await api('GET','/remote/settings');if(!d)return;const s=d?.style||{};
  setColorFromHex('color',s.subtitleTextColor||'#FFA100');setColorFromHex('stroke',s.subtitleStrokeColor||'#000000');
  const el=document.getElementById('sub-position');if(el)el.value=s.subtitlePositionPercent??12;
}
async function loadRemoteSettings(){
  const d=await api('GET','/remote/credentials');if(!d)return;
  const u=document.getElementById('remote-user');if(u)u.value=d.username||'';
  const p=document.getElementById('remote-pass');if(p)p.value=d.password||'';
}

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function hexToHsl(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];const r=parseInt(hex.substring(0,2),16)/255,g=parseInt(hex.substring(2,4),16)/255,b=parseInt(hex.substring(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))/6;else if(mx===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
function getColorHex(p){const h=parseInt(document.getElementById(p+'-h')?.value||0),s=parseInt(document.getElementById(p+'-s')?.value||0),l=parseInt(document.getElementById(p+'-l')?.value||50);return hslToHex(h,s,l)}
function setColorFromHex(p,hex){const c=hexToHsl(hex);['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el){el.value=c[t];const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=c[t]+(t==='h'?'°':'%')}});updatePreview(p)}
function updatePreview(p){const hex=getColorHex(p);const el=document.getElementById(p+'-preview');if(el)el.style.background=hex}
function setupColorPicker(p,def){setColorFromHex(p,def);['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el)el.addEventListener('input',()=>{const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=el.value+(t==='h'?'°':'%');updatePreview(p)})})}

async function loadTasks(){
  const d=await api('GET','/remote/tasks');if(d?.tasks)tasks=d.tasks;
  try{const h=await api('GET','/remote/history');if(h?.history)for(const r of h.history)if(r.items)for(const i of r.items)if(!tasks.find(t=>t.id===i.id))tasks.push({...i,_h:1})}catch{}
  renderTasks();
}
async function sendTask(){
  const input=document.getElementById('task-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  input.disabled=true;const btn=document.getElementById('send-btn');if(btn)btn.disabled=true;
  try{const d=await api('POST','/tasks',{text});if(d?.ok){showToast('已添加 '+(d.tasks?.length||0)+' 个任务');input.value='';input.style.height='auto'}else showToast(d?.error||'发送失败')}catch{showToast('网络错误')}
  input.disabled=false;if(btn)btn.disabled=false;input.focus();
}
function renderTasks(){
  const el=document.getElementById('chat-stream'),empty=document.getElementById('empty-state');
  if(!el)return;if(!tasks.length){if(empty)empty.style.display='';return}
  if(empty)empty.style.display='none';
  const sorted=[...tasks].sort((a,b)=>(a.index||a.queueIndex||0)-(b.index||b.queueIndex||0));
  el.innerHTML=sorted.map(t=>{
    const st=t.status||'pending',pg=Math.max(0,Math.min(100,Number(t.progress||0)));
    const idx=t.index||t.queueIndex||0;
    const name=idx?'任务'+idx:(t.isOriginal?'原创':(t.taskName||'任务'));
    const bc={running:'badge-running',completed:'badge-completed',warning:'badge-warning',failed:'badge-failed'}[st]||'badge-pending';
    const bt={pending:'等待',queued:'等待',running:'执行中',completed:'成功',warning:'部分完成',failed:'失败',stopped:'已停止'}[st]||st;
    const barC=st==='completed'?'done':st==='failed'?'error':'';
    const msg=t.message||'';
    let acts='';
    if(st==='failed')acts+='<button class="btn btn-ghost" style="height:28px;padding:0 10px;font-size:11px" data-action="retry" data-id="'+t.id+'">重试</button>';
    if(['pending','queued','running'].includes(st))acts+='<button class="btn btn-ghost" style="height:28px;padding:0 10px;font-size:11px" data-action="stop" data-id="'+t.id+'">停止</button>';
    return '<div class="task"><div class="task-head"><span class="task-name">'+esc(name)+'</span><span class="task-badge '+bc+'">'+bt+'</span></div>'+
      (t.isOriginal?'<div style="margin-top:4px"><span style="font-size:10px;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg)">原创</span></div>':'')+
      (msg?'<div class="task-msg">'+esc(msg)+'</div>':'')+
      '<div class="task-bar"><div class="task-bar-fill '+barC+'" style="width:'+pg+'%"></div></div>'+
      (acts?'<div class="task-actions">'+acts+'</div>':'')+'</div>';
  }).join('');
  const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;
}

// ── Init ──
if(token){initApp()}else{renderLogin()}
</script>
