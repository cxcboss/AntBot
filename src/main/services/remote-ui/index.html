<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搬运蚁 远程控制</title>
<script>
// 跟随系统深浅色模式（在渲染前应用，避免闪烁）
(function(){
  function apply(){
    document.documentElement.classList.toggle('dark',window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  apply();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',apply);
})();
</script>
<style>
/* ── Design Tokens（与 App 端 design-tokens.css 一致，中性极简） ── */
:root{
  color-scheme:light;
  --background:#ffffff;--foreground:#111111;
  --card:#ffffff;--card-foreground:#111111;
  --popover:#ffffff;--popover-foreground:#111111;
  --primary:#111111;--primary-hover:#2b2b2b;--primary-foreground:#ffffff;
  --secondary:#f5f5f4;--secondary-foreground:#111111;
  --muted:#f0f0ef;--muted-foreground:#71717a;
  --accent:#f4f4f5;--accent-foreground:#111111;
  --destructive:#dc2626;--destructive-foreground:#ffffff;
  --success:#16a34a;--success-foreground:#ffffff;
  --warning:#d97706;--warning-foreground:#ffffff;
  --info:#2563eb;--info-foreground:#ffffff;
  --destructive-bg:#fef2f2;--success-bg:#f0fdf4;--warning-bg:#fffbeb;--info-bg:#eff6ff;
  --border:#e4e4e7;--input:#e4e4e7;--ring:#111111;
  --radius-xs:4px;--radius-sm:6px;--radius:8px;--radius-lg:12px;--radius-xl:16px;--radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-md:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.04);
  --shadow-lg:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.06);
  --transition-fast:120ms cubic-bezier(.4,0,.2,1);
  --transition-normal:200ms cubic-bezier(.4,0,.2,1);
  --transition-slow:300ms cubic-bezier(.4,0,.2,1);
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Inter",sans-serif;
  --font-mono:"SF Mono","Fira Code","JetBrains Mono",monospace;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;
  --sidebar-w:220px;--header-h:48px;
}
.dark{
  color-scheme:dark;
  --background:#0a0a0b;--foreground:#fafafa;
  --card:#141416;--card-foreground:#fafafa;
  --popover:#1a1a1c;--popover-foreground:#fafafa;
  --primary:#fafafa;--primary-hover:#d4d4d8;--primary-foreground:#0a0a0b;
  --secondary:#1c1c1e;--secondary-foreground:#fafafa;
  --muted:#232326;--muted-foreground:#a1a1aa;
  --accent:#26262a;--accent-foreground:#fafafa;
  --destructive:#ef4444;--destructive-foreground:#ffffff;
  --success:#22c55e;--success-foreground:#ffffff;
  --warning:#f59e0b;--warning-foreground:#0a0a0b;
  --info:#3b82f6;--info-foreground:#ffffff;
  --destructive-bg:#2a0a0a;--success-bg:#052e16;--warning-bg:#2a1a05;--info-bg:#172554;
  --border:#26262a;--input:#26262a;--ring:#fafafa;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
  --shadow:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.3);
  --shadow-md:0 10px 15px -3px rgba(0,0,0,.45),0 4px 6px -4px rgba(0,0,0,.35);
  --shadow-lg:0 20px 25px -5px rgba(0,0,0,.55),0 8px 10px -6px rgba(0,0,0,.4);
}

/* ── 基础 ── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--background);color:var(--foreground);font-size:13px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:var(--font-sans);cursor:pointer}
input,textarea{font-family:var(--font-sans)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:var(--radius-full)}
::-webkit-scrollbar-track{background:transparent}

/* ── 按钮（App 规范） ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;background:var(--card);color:var(--foreground);transition:background var(--transition-fast),border-color var(--transition-fast);outline:none;text-decoration:none}
.btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{border:1px solid var(--border);background:var(--card);color:var(--foreground)}
.btn-ghost:hover{background:var(--muted)}
.btn-danger{background:var(--destructive);color:var(--destructive-foreground)}
.btn-danger:hover{opacity:.9}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:var(--radius-sm)}
.btn-xs{height:24px;padding:0 8px;font-size:11px;border-radius:var(--radius-sm)}
.btn-block{width:100%;display:flex}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 输入框（App 规范） ── */
.form-input,.input-field{height:32px;width:100%;padding:0 12px;border:1px solid var(--input);border-radius:var(--radius);background:var(--background);color:var(--foreground);font-size:13px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.form-input:focus,.input-field:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 15%,transparent)}
.input-field{height:auto;resize:none;padding:8px 12px;line-height:1.4;max-height:120px}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--muted-foreground);margin-bottom:6px;letter-spacing:.5px}
.form-group{margin-bottom:var(--space-4)}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:var(--muted);border-radius:var(--radius-full);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{opacity:1}

/* ── 卡片 ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);transition:border-color var(--transition-fast)}
.section-title{font-size:15px;font-weight:600;margin-bottom:var(--space-4);padding-bottom:var(--space-2);border-bottom:1px solid var(--border)}

/* ── 徽章（文字 + 圆点，App 风格） ── */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--muted);color:var(--muted-foreground)}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.badge-pending,.badge-checking{background:var(--muted);color:var(--muted-foreground)}
.badge-running{background:var(--accent);color:var(--accent-foreground)}
.badge-completed,.badge-ok{background:var(--success-bg);color:var(--success)}
.badge-warning{background:var(--warning-bg);color:var(--warning)}
.badge-failed,.badge-fail{background:var(--destructive-bg);color:var(--destructive)}

/* ── Toast ── */
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--popover);border:1px solid var(--border);color:var(--foreground);padding:8px 16px;border-radius:var(--radius-lg);font-size:12px;z-index:300;box-shadow:var(--shadow-lg);animation:toast-in var(--transition-normal);display:flex;align-items:center;gap:8px;max-width:88vw}
.toast-close{background:none;border:none;color:var(--muted-foreground);font-size:14px;padding:2px;line-height:1;flex-shrink:0}
.toast-close:active{color:var(--foreground)}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* ── 对话框 ── */
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200;padding:var(--space-4)}
.dialog-overlay.show{display:flex}
.dialog{background:var(--popover);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:380px;max-height:80vh;overflow-y:auto;padding:var(--space-5);animation:dlg-in var(--transition-normal)}
@keyframes dlg-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.dialog-title{font-size:15px;font-weight:600;margin-bottom:var(--space-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.dialog-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto}
.dialog-item{display:flex;align-items:center;width:100%;padding:9px 12px;border:none;background:none;color:var(--foreground);font-size:13px;text-align:left;cursor:pointer;border-radius:var(--radius);transition:background var(--transition-fast)}
.dialog-item:hover{background:var(--muted)}
.dialog-item.active{background:var(--accent);color:var(--accent-foreground)}
.dialog-item .check{margin-left:auto;opacity:0;color:var(--accent-foreground)}
.dialog-item.active .check{opacity:1}
.dialog-close{background:none;border:none;color:var(--muted-foreground);cursor:pointer;font-size:16px;padding:4px;border-radius:var(--radius);line-height:1}
.dialog-close:hover{background:var(--muted);color:var(--foreground)}
.dialog-empty{padding:var(--space-4);text-align:center;font-size:12px;color:var(--muted-foreground)}

/* ── 布局壳 ── */
.app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;height:100dvh}
.header{display:flex;align-items:center;height:var(--header-h);padding:0 var(--space-3);background:var(--background);border-bottom:1px solid var(--border);gap:var(--space-2);flex-shrink:0}
.header-title{flex:1;font-size:15px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-device{font-size:12px;color:var(--muted-foreground);cursor:pointer;padding:4px 10px;border-radius:var(--radius);transition:background var(--transition-fast);display:inline-flex;align-items:center;gap:4px;flex-shrink:0;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.header-device:hover{background:var(--muted)}
.icon-btn{background:none;border:none;color:var(--foreground);cursor:pointer;padding:6px;border-radius:var(--radius);transition:background var(--transition-fast);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:hover{background:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.app-body{flex:1;display:flex;overflow:hidden;position:relative}

/* ── 侧边栏（手机抽屉 / 桌面常驻） ── */
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--background);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform var(--transition-normal);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:var(--space-4);font-size:15px;font-weight:700;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:var(--space-2);display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--radius);font-size:13px;color:var(--muted-foreground);cursor:pointer;border:none;background:none;text-align:left;transition:background var(--transition-fast),color var(--transition-fast);font-weight:500}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.nav-item:hover{background:var(--muted);color:var(--foreground)}
.nav-item.active{background:var(--accent);color:var(--accent-foreground)}
.sidebar-version{padding:var(--space-2) var(--space-4);font-size:11px;color:var(--muted-foreground);text-align:center;border-top:1px solid var(--border)}

/* ── 内容区 ── */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.page{display:none;height:100%;overflow-y:auto;padding:var(--space-4)}
.page.active{display:block}
#page-main{display:none;flex-direction:column;padding:0;overflow:hidden}
#page-main.active{display:flex}

/* ── 连接横幅 ── */
.conn-banner{display:none;padding:6px var(--space-3);font-size:11px;text-align:center;gap:6px;align-items:center;justify-content:center;flex-shrink:0}
.conn-banner.show{display:flex}
.conn-banner.ok{background:var(--success-bg);color:var(--success)}
.conn-banner.checking,.conn-banner.retry{background:var(--warning-bg);color:var(--warning)}
.conn-banner.offline{background:var(--destructive-bg);color:var(--destructive)}
.conn-spinner{width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--muted-foreground);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 主控：时间线（与 App 对齐） ── */
.chat{flex:1;overflow-y:auto;padding:0 var(--space-4)}
.chat-stream{display:flex;flex-direction:column;max-width:640px;margin:0 auto;min-height:100%}
.chat-day{display:flex;align-items:center;gap:12px;padding:20px 0 0;font-size:11px;color:var(--muted-foreground)}
.chat-day::before,.chat-day::after{content:'';flex:1;height:1px;background:var(--border)}
.run-group{display:flex;flex-direction:column;gap:8px;padding:16px 0}
.run-group+.run-group{border-top:1px solid var(--border)}
.msg-time{align-self:center;font-size:11px;color:var(--muted-foreground);margin-top:12px}
.msg-user{display:flex;flex-direction:column;gap:6px}
.msg-content{font-size:13px;line-height:1.7;color:var(--foreground);white-space:pre-wrap;word-break:break-word}
.msg-actions{display:flex;gap:2px;opacity:0;transition:opacity var(--transition-fast)}
.run-group:hover .msg-actions{opacity:1}
.msg-act-btn{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:11px;color:var(--muted-foreground);background:none;border:none;transition:background var(--transition-fast),color var(--transition-fast)}
.msg-act-btn:hover{background:var(--muted);color:var(--foreground)}
.msg-raw{display:none;font-size:11px;color:var(--muted-foreground);padding:8px 10px;background:var(--secondary);border-radius:var(--radius);white-space:pre-wrap;word-break:break-word}
.msg-raw.show{display:block}

/* 规则面板 */
.msg-rules{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--secondary);overflow:hidden}
.msg-rules-head{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;font-size:12px;color:var(--muted-foreground);text-align:left;background:none;border:none;cursor:pointer;transition:background var(--transition-fast)}
.msg-rules-head:hover{background:var(--muted)}
.msg-rules-summary{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-rules-arrow{font-size:10px;transition:transform var(--transition-normal);flex-shrink:0}
.msg-rules.open .msg-rules-arrow{transform:rotate(90deg)}
.msg-rules-body{display:none;padding:4px 12px 10px}
.msg-rules.open .msg-rules-body{display:block}
.rule-item{padding:8px 0;border-top:1px solid var(--border);font-size:12px}
.rule-item:first-child{border-top:none}
.rule-item-title{font-weight:600;color:var(--foreground);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule-item-fields{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted-foreground)}
.rule-field{display:inline-flex;gap:4px}
.rule-field b{font-weight:500;color:var(--foreground)}

/* 任务卡片（App 对齐） */
.task-stack{display:flex;flex-direction:column;gap:6px}
.task{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card);width:100%;transition:border-color var(--transition-fast)}
.task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.task.warning::before{background:var(--warning)}
.task.failed::before{background:var(--destructive)}
.task.running::before,.task.preparing::before{background:var(--primary)}
.task.queued::before,.task.pending::before{background:var(--muted-foreground)}
.task-inner{display:flex;flex-direction:column;gap:6px;padding:10px 14px}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.task-title{font-size:13px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-badge{font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}
.task-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.task.running .task-badge{color:var(--primary)}
.task.warning .task-badge{color:var(--warning)}
.task.failed .task-badge{color:var(--destructive)}
.task-msg{font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.failed .task-msg{color:var(--destructive)}
.task.warning .task-msg{color:var(--warning)}
.task-meta{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11px;align-items:center}
.task-meta-item{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:9999px;background:var(--muted);color:var(--muted-foreground);line-height:18px}
.task-meta-platform{color:var(--muted-foreground)}
.task-meta-original{color:var(--foreground)}
.task-meta-campaign{background:var(--accent);color:var(--accent-foreground)}
.task-meta-campaign b{font-weight:600}
.task-meta-time{color:var(--muted-foreground)}
.task-meta-item.danger{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.task-detail-toggle{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--radius-sm);font-size:11px;color:var(--muted-foreground);background:none;border:none;transition:background var(--transition-fast),color var(--transition-fast)}
.task-detail-toggle:hover{background:var(--muted);color:var(--foreground)}
.task-detail-toggle .td-chevron{font-size:10px;display:inline-block;transition:transform var(--transition-normal)}
.task-detail.open .task-detail-toggle .td-chevron{transform:rotate(90deg)}
.task-detail-body{display:none;margin-top:4px;padding:8px 10px;background:var(--secondary);border-radius:var(--radius);font-size:12px}
.task-detail.open .task-detail-body{display:block}
.task-detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:4px 12px}
.task-detail-item{display:flex;gap:6px;color:var(--muted-foreground)}
.task-detail-item b{font-weight:500;color:var(--foreground);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-bar{height:3px;background:var(--muted);border-radius:var(--radius-full);overflow:hidden}
.task-bar-in{height:100%;width:0;background:var(--primary);opacity:.5;transition:width var(--transition-normal);border-radius:var(--radius-full)}
.task.running .task-bar-in{opacity:1}
.task.failed .task-bar-in{background:var(--destructive)}
.task.preparing .task-bar-in,.task.composing .task-bar-in,.task.running .task-bar-in{animation:task-shimmer 2s ease-in-out infinite}
@keyframes task-shimmer{0%,100%{opacity:1}50%{opacity:.55}}
.task-actions{display:flex;gap:6px;justify-content:flex-end}
.task-btn{padding:4px 10px;border-radius:var(--radius);font-size:11px;font-weight:500;border:1px solid var(--border);background:var(--card);color:var(--foreground);transition:background var(--transition-fast),border-color var(--transition-fast)}
.task-btn:hover{border-color:var(--muted-foreground);background:var(--muted)}
.task-btn:disabled{opacity:.5;cursor:not-allowed}
.task-btn.skip:hover{border-color:var(--muted-foreground)}
.task-btn.cancel:hover{border-color:var(--destructive);color:var(--destructive);background:var(--destructive-bg)}
.task-cancelling{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--warning);animation:cancelBlink 1.2s ease-in-out infinite;z-index:2}
@keyframes cancelBlink{0%,100%{opacity:1}50%{opacity:.3}}

/* 空状态 */
.empty{text-align:center;padding:var(--space-10) var(--space-4);color:var(--muted-foreground);font-size:13px;margin:auto}
.empty-icon{font-size:32px;margin-bottom:var(--space-2);opacity:.5}

/* ── 输入条 ── */
.input-bar{border-top:1px solid var(--border);padding:var(--space-2) var(--space-4) var(--space-3);background:var(--background);flex-shrink:0}
.input-row{display:flex;gap:var(--space-2);align-items:flex-end;max-width:640px;margin:0 auto}

<body>
<div id="app"></div>
<script>
const HUB_URL='https://hub.onebugmanai.online';
const APP_VERSION='1.9.3';
let API=window.location.origin;
let token=localStorage.getItem('antbot-token');
let tasks=[];
let monitors=[];
let historyRecords=[];
let sseSource=null;
let currentPage='main';
let deviceId=localStorage.getItem('antbot-device-id')||'';
let deviceName=localStorage.getItem('antbot-device')||'';
let consecutiveErrors=0;
let reconnectTimer=null;

// 从 URL 参数获取 Hub 传递的 token 和设备标识
const urlParams=new URLSearchParams(window.location.search);
const hubToken=urlParams.get('hub_token');
const hubDeviceId=urlParams.get('device_id');
const hubDevice=urlParams.get('device_name');
if(hubToken){
  token=hubToken;
  localStorage.setItem('antbot-token',token);
  if(hubDeviceId){deviceId=hubDeviceId;localStorage.setItem('antbot-device-id',deviceId);}
  if(hubDevice){deviceName=hubDevice;localStorage.setItem('antbot-device',deviceName);}
  // 清除 URL 参数
  window.history.replaceState({},'',window.location.pathname);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── 格式化工具（与 App 对齐） ── */
const platformLabel={videoChannel:'视频号',douyin:'抖音'};
const shortUrl=(url)=>'…'+String(url||'').replace(/[^\s,，。；;）)]+$/,'').slice(-8);
function fmtPvTime(v){
  if(!v)return '';
  const d=new Date(v);
  if(isNaN(d))return String(v);
  const pad=n=>String(n).padStart(2,'0');
  const hm=pad(d.getHours())+':'+pad(d.getMinutes());
  return d.toDateString()===new Date().toDateString()?hm:(pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm);
}
function fmtDuration(sec){
  sec=Math.max(0,Math.round(Number(sec)||0));
  if(sec<60)return sec+'秒';
  const m=Math.floor(sec/60),s=sec%60;
  if(m<60)return s?(m+'分'+s+'秒'):(m+'分钟');
  return Math.floor(m/60)+'小时'+(m%60)+'分';
}
const statusTextMap={pending:'等待',queued:'等待',running:'执行中',preparing:'准备中',ready:'就绪',completed:'成功',warning:'部分完成',failed:'失败',stopped:'已停止',cancelling:'取消中'};
const statusText=s=>statusTextMap[s]||s;

async function login(password){
  try{
    const res=await fetch(API+'/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});
    const data=await res.json();
    if(data.ok){
      token=data.token;
      localStorage.setItem('antbot-token',token);
      initApp();
    }else{
      const el=document.getElementById('login-error');
      if(el)el.textContent=data.error||'登录失败';
      else showToast(data.error||'登录失败');
    }
  }catch(e){
    const el=document.getElementById('login-error');
    if(el)el.textContent='网络错误，请重试';
    else showToast('网络错误');
  }
}

function logout(){
  token=null;
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  renderLogin();
}

function exitToHub(){
  token=null;
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  localStorage.removeItem('antbot-device');
  localStorage.removeItem('antbot-device-id');
  window.location.href=HUB_URL;
}

async function api(method,path,body){
  const opts={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(API+path,opts);
  if(res.status===401){logout();return null;}
  return res.json();
}

function showToast(msg,dur){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span>'+esc(msg)+'</span><button class="toast-close" type="button">✕</button>';
  el.querySelector('.toast-close').addEventListener('click',()=>el.remove());
  el.addEventListener('click',e=>{if(e.target.closest('.toast-close'))return;el.remove();});
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),dur||5000);
}

function copyText(text){
  const done=()=>showToast('已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{fallbackCopy(text);done();});
  }else{fallbackCopy(text);done();}
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy')}catch{}
  document.body.removeChild(ta);
}

function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null;}
  sseSource=new EventSource(API+'/remote/events?token='+token);
  sseSource.onopen=()=>{consecutiveErrors=0;hideBanner()};
  sseSource.addEventListener('task-update',e=>{
    const t=JSON.parse(e.data);const i=tasks.findIndex(x=>x.id===t.id);
    if(i>=0)tasks[i]={...tasks[i],...t};else tasks.push(t);
    renderTimeline();
  });
  sseSource.addEventListener('status',e=>{
    const s=JSON.parse(e.data);
    if(s.tasks){tasks=s.tasks;renderTimeline();}
  });
  sseSource.addEventListener('settings-update',e=>{
    const patch=JSON.parse(e.data);
    if(currentSettings){
      if(patch.editDefaults)currentSettings.editDefaults={...currentSettings.editDefaults,...patch.editDefaults};
      if(patch.voiceClone)currentSettings.voiceClone={...currentSettings.voiceClone,...patch.voiceClone};
      if(patch.retry)currentSettings.retry={...currentSettings.retry,...patch.retry};
      renderChips(currentSettings);
    }
  });
  sseSource.addEventListener('monitor-update',e=>{
    const payload=JSON.parse(e.data||'{}');
    if(payload.removed&&payload.id){monitors=monitors.filter(m=>m.id!==payload.id)}
    else if(payload.monitor?.id){const i=monitors.findIndex(m=>m.id===payload.monitor.id);if(i>=0)monitors[i]=payload.monitor;else monitors.unshift(payload.monitor)}
    renderMonitors();
  });
  sseSource.onerror=()=>{
    consecutiveErrors++;
    if(consecutiveErrors>=3){showBanner('retry');reconnectViaHub();}
    else if(consecutiveErrors>=1){showBanner('checking')}
  };
}

async function reconnectViaHub(){
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(!deviceId)return;
  try{
    const res=await fetch(HUB_URL+'/api/devices');
    const data=await res.json();
    if(data.ok){
      const dev=data.devices.find(d=>d.deviceId===deviceId);
      if(dev&&dev.tunnelUrl&&dev.tunnelUrl!==API){
        showBanner('newurl');API=dev.tunnelUrl;
        setTimeout(()=>{const sep=API.includes('?')?'&':'?';window.location.href=API+sep+'hub_token='+(token||'')+'&device_id='+encodeURIComponent(deviceId)+'&device_name='+encodeURIComponent(deviceName)},1500);
        return;
      }
    }
  }catch{}
  showBanner('offline');
  reconnectTimer=setTimeout(reconnectViaHub,15000);
}

function showBanner(st){
  const b=document.getElementById('conn-banner');if(!b)return;
  b.className='conn-banner show '+st;
  const t=document.getElementById('conn-text');
  const msgs={checking:'连接中断，正在检查...',retry:'连接中断，重连中...',newurl:'服务器已更新，正在跳转...',offline:'电脑可能已离线'};
  if(t)t.textContent=msgs[st]||'正在连接...';
}
function hideBanner(){const b=document.getElementById('conn-banner');if(b){b.className='conn-banner show ok';const t=document.getElementById('conn-text');if(t)t.textContent='已连接';setTimeout(()=>{b.className='conn-banner'},2000);}}

function bindEvents(){
  document.getElementById('header-device')?.addEventListener('click',e=>{
    e.stopPropagation();
    document.getElementById('exit-menu')?.classList.toggle('show');
  });
  document.addEventListener('click',()=>{
    document.getElementById('exit-menu')?.classList.remove('show');
  });
  document.getElementById('exit-btn')?.addEventListener('click',exitToHub);

  document.getElementById('sidebar-toggle')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('show');
  });
  document.getElementById('sidebar-overlay')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  });
  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.addEventListener('click',()=>switchPage(btn.dataset.page));
  });
  const input=document.getElementById('task-input');
  const sendBtn=document.getElementById('send-btn');
  const optBtn=document.getElementById('opt-btn');
  const syncBtns=()=>{
    const has=!!(input?.value?.trim());
    if(sendBtn)sendBtn.disabled=!has;
    if(optBtn)optBtn.style.display=has?'':'none';
  };
  if(input){
    syncBtns();
    input.addEventListener('input',()=>{
      input.style.height='auto';
      input.style.height=Math.min(input.scrollHeight,120)+'px';
      syncBtns();
      queueParsePreview();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask();}});
  }
  if(sendBtn)sendBtn.addEventListener('click',sendTask);
  document.getElementById('opt-btn')?.addEventListener('click',optimizeTask);
  document.getElementById('chat-stream')?.addEventListener('click',e=>{
    // 时间线交互：原文/复制/规则展开/任务详情/操作
    const rawBtn=e.target.closest('[data-msg-raw]');
    if(rawBtn){
      const box=rawBtn.closest('.msg-user')?.querySelector('.msg-raw');
      if(box){const shown=box.classList.toggle('show');rawBtn.textContent=shown?'隐藏原文':'原文';}
      return;
    }
    const copyBtn=e.target.closest('[data-msg-copy]');
    if(copyBtn){copyText(copyBtn.dataset.copy||'');return;}
    const ruleToggle=e.target.closest('[data-rule-toggle]');
    if(ruleToggle){ruleToggle.closest('.msg-rules')?.classList.toggle('open');return;}
    const detailToggle=e.target.closest('[data-task-detail]');
    if(detailToggle){detailToggle.closest('.task-detail')?.classList.toggle('open');return;}
    const actBtn=e.target.closest('[data-action]');
    if(!actBtn)return;
    const actId=actBtn.dataset.id;
    const actLabel=(label)=>{actBtn.disabled=true;actBtn.textContent=label;};
    if(actBtn.dataset.action==='stop'){actLabel('取消中');api('POST','/remote/tasks/'+actId+'/stop').then(r=>{if(r?.ok)showToast('已停止');else showToast(r?.error||'取消失败')}).catch(()=>{showToast('网络错误')}).finally(()=>{actBtn.disabled=false;actBtn.textContent='取消'})}
    if(actBtn.dataset.action==='skip'){api('POST','/remote/tasks/'+actId+'/stop').then(r=>{if(r?.ok)showToast('已跳过');else showToast(r?.error||'跳过失败')}).catch(()=>{showToast('网络错误')})}
    if(actBtn.dataset.action==='retry'){actLabel('重试中');api('POST','/remote/tasks/'+actId+'/retry').then(r=>{if(r?.ok)showToast('已重试');else showToast(r?.error||'重试失败')}).catch(()=>{showToast('网络错误')}).finally(()=>{actBtn.disabled=false;actBtn.textContent='重试'})}
    if(actBtn.dataset.action==='republish'){
      actLabel('发布中...');
      api('POST','/remote/tasks/'+actId+'/republish').then(r=>{
        if(r?.ok)showToast('已重新发布');
        else if(r?.error==='FILE_DELETED')showToast('视频文件已被删除，无法重新发布');
        else showToast(r?.error||'发布失败');
      }).catch(()=>{showToast('网络错误')}).finally(()=>{actBtn.disabled=false;actBtn.textContent='重新发布'});
    }
  });
  document.getElementById('monitor-add-btn')?.addEventListener('click',()=>openMonitorDialog(null));
  document.getElementById('monitor-check-all-btn')?.addEventListener('click',checkAllMonitors);
  document.getElementById('monitor-save-btn')?.addEventListener('click',saveMonitor);
  document.getElementById('monitor-cancel-btn')?.addEventListener('click',closeMonitorDialog);
  document.getElementById('monitor-close-btn')?.addEventListener('click',closeMonitorDialog);
  document.getElementById('monitor-source-type')?.addEventListener('change',updateMonitorFormHints);
  document.getElementById('monitor-modal')?.addEventListener('click',e=>{if(e.target.id==='monitor-modal')closeMonitorDialog()});
  document.getElementById('monitor-list')?.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-monitor-act]');if(!btn)return;
    const id=btn.dataset.id;const monitor=monitors.find(m=>m.id===id);if(!monitor)return;
    const act=btn.dataset.monitorAct;
    if(act==='edit'){openMonitorDialog(monitor);return}
    if(act==='remove'){
      if(!confirm('确定删除这个监控？'))return;
      btn.disabled=true;const d=await api('POST','/remote/monitors/'+encodeURIComponent(id)+'/remove');
      if(d?.ok){monitors=monitors.filter(m=>m.id!==id);renderMonitors();showToast('监控已删除')}else{showToast(d?.error||'删除失败');btn.disabled=false}
      return;
    }
    if(act==='toggle'){
      const d=await api('POST','/remote/monitors/'+encodeURIComponent(id)+'/toggle',{enabled:!monitor.enabled});
      if(d?.ok&&d.monitor){Object.assign(monitor,d.monitor);renderMonitors()}else showToast(d?.error||'更新失败');
      return;
    }
    if(act==='check'){
      btn.disabled=true;const old=btn.textContent;btn.textContent='检查中...';
      try{const d=await api('POST','/remote/monitors/'+encodeURIComponent(id)+'/check');if(d?.ok){await loadMonitors();const n=d.result?.newVideos?.length||0;showToast(d.result?.firstRun?'首次已建立视频基线':(n?'发现 '+n+' 个新视频，已入队':'暂无新视频'))}else showToast(d?.error||'检查失败')}catch{showToast('网络错误')}finally{btn.disabled=false;btn.textContent=old}
    }
  });
  document.getElementById('sub-save-btn')?.addEventListener('click',async()=>{
    await api('POST','/remote/settings',{style:{subtitleTextColor:getColorHex('color'),subtitleStrokeColor:getColorHex('stroke'),subtitlePositionPercent:parseInt(document.getElementById('sub-position')?.value)||12}});
    showToast('已保存并同步');
  });
  document.getElementById('remote-save-btn')?.addEventListener('click',async()=>{
    const p=document.getElementById('remote-pass')?.value?.trim();
    if(!p){showToast('请设置密码');return;}
    await api('POST','/remote/settings',{remote:{password:p}});
    showToast('已保存，需重新登录');setTimeout(logout,1000);
  });
  document.querySelectorAll('.login-check-btn').forEach(btn=>{
    btn.addEventListener('click',()=>checkPlatformLogin(btn.dataset.platform));
  });
  document.querySelectorAll('.login-logout-btn').forEach(btn=>{
    btn.addEventListener('click',()=>logoutPlatform(btn.dataset.platform, btn));
  });
  document.getElementById('qr-overlay')?.addEventListener('click',e=>{if(e.target.id==='qr-overlay')hideQrOverlay();});
  document.getElementById('qr-close-btn')?.addEventListener('click',hideQrOverlay);
  document.getElementById('qr-save-btn')?.addEventListener('click',()=>{const img=document.getElementById('qr-overlay-img');if(img?.src)saveQrImage(img.src);});
  setupColorPicker('color','#FFA100');
  setupColorPicker('stroke','#000000');
}

function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.getElementById('header-title').textContent={main:'主控',subtitle:'字幕',remote:'远程',monitor:'监控',login:'平台登录',status:'状态'}[page]||'主控';
  // 桌面侧边栏常驻不关闭；手机抽屉切换后关闭

async function loadSettings(){const d=await api('GET','/remote/settings');if(d){currentSettings=d;renderChips(d);}}
let currentSettings=null;

function renderChips(s){
  const c=document.getElementById('chips');if(!c)return;
  // 音色优先读 voiceClone（App 端选音色写入的位置），兼容旧 editDefaults.voice
  const style=s?.editDefaults?.style||'未设置';
  const voice=s?.voiceClone?.profileName||s?.editDefaults?.voice||'未设置';
  const vs=Number(s?.style?.voiceSpeed??1.1);
  const rt=Math.max(0,Number(s?.retry?.failedTaskRetries??0));
  c.innerHTML='<button class="chip" data-act="voice"><span class="vl">'+esc(voice)+'</span></button>'
    +'<button class="chip" data-act="style"><span class="vl">'+esc(style)+'</span></button>'
    +'<button class="chip" data-act="more"><span class="vl">更多</span></button>'
    +'<span class="chip-spacer"></span>'
    +'<button class="chip" data-act="speed"><span class="vl">语速'+vs.toFixed(1)+'x</span></button>'
    +'<button class="chip" data-act="retry"><span class="vl">重试'+rt+'次</span></button>';
  c.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();showChipPopup(btn.dataset.act,btn)});
  });

// ── Chip 弹窗（与 App 对齐：音色分类折叠 / 风格列表 / 更多开关 / 滑块） ──
let activeChipPopup=null;
let activeChipAnchor=null;
let activeChipDismiss=null;
function closeChipPopup(){
  if(activeChipDismiss){document.removeEventListener('mousedown',activeChipDismiss);activeChipDismiss=null}
  if(activeChipPopup){activeChipPopup.remove();activeChipPopup=null;activeChipAnchor=null}
}
function positionChipPopup(popup,anchor){
  document.body.appendChild(popup);
  activeChipPopup=popup;activeChipAnchor=anchor;
  repositionChipPopup();
  activeChipDismiss=e=>{if(!e.target.closest('.chip-popup')&&!e.target.closest('.chip'))closeChipPopup()};
  setTimeout(()=>{if(activeChipDismiss)document.addEventListener('mousedown',activeChipDismiss)},0);
}
function repositionChipPopup(){
  const popup=activeChipPopup,anchor=activeChipAnchor;
  if(!popup||!anchor) return;
  const rect=anchor.getBoundingClientRect();
  const vw=window.innerWidth,vh=window.innerHeight;
  // 先限制最大高度为可视区上方/下方可用空间
  const spaceAbove=rect.top-12;
  const spaceBelow=vh-rect.bottom-12;
  const preferAbove=spaceAbove>120;
  const available=preferAbove?spaceAbove:spaceBelow;
  const maxH=Math.min(320,Math.max(96,available-8));
  popup.style.maxHeight=maxH+'px';
  popup.style.overflowY='auto';
  // 测量真实宽高（受 maxHeight 限制后）
  const pw=popup.offsetWidth,ph=popup.offsetHeight;
  let left=rect.left+rect.width/2-pw/2;
  let top;
  if(preferAbove){
    top=rect.top-ph-8;
    if(top<8) top=8;
  }else{
    top=rect.bottom+8;
    if(top+ph>vh-8) top=Math.max(8,vh-ph-8);
  }
  if(left<8)left=8;if(left+pw>vw-8)left=vw-pw-8;
  popup.style.left=left+'px';popup.style.top=top+'px';
}
window.addEventListener('resize',()=>{if(activeChipPopup)repositionChipPopup()});
window.addEventListener('scroll',()=>{if(activeChipPopup)repositionChipPopup()},true);

function showChipPopup(type,anchor){
  closeChipPopup();
  if(type==='voice'){
    const popup=document.createElement('div');popup.className='chip-popup';
    popup.innerHTML='<div class="dialog-empty">加载中...</div>';
    positionChipPopup(popup,anchor);
    api('GET','/remote/voices').then(d=>{
      const voices=d?.voices||[];
      if(!voices.length){popup.innerHTML='<div class="dialog-empty">暂无音色，请先在App中克隆</div>';return;}
      const cur=currentSettings?.voiceClone?.profileName||currentSettings?.editDefaults?.voice||'';
      const azure=voices.filter(v=>v.source==='azure'),clone=voices.filter(v=>v.source!=='azure');
      const activeSource=azure.some(v=>v.name===cur)?'azure':(clone.some(v=>v.name===cur)?'clone':'');
      const renderSection=(label,items,src)=>{
        if(!items.length)return '';
        const open=activeSource===src?' open':'';
        const collapsed=open?'':' style="display:none"';
        return '<div class="style-section" data-section="'+src+'"><span class="style-section-arrow'+open+'" data-arrow>▶</span>'+esc(label)+'</div><div class="style-section-items"'+collapsed+'>'+items.map(v=>'<div class="style-item'+(v.name===cur?' active':'')+'" data-vname="'+esc(v.name)+'" data-vid="'+esc(v.id||'')+'">'+esc(v.name)+'</div>').join('')+'</div>';
      };
      popup.innerHTML='<div class="style-list">'+renderSection('内置音色（Azure TTS）',azure,'azure')+renderSection('克隆音色',clone,'clone')+'</div>';
      if(activeChipPopup===popup)repositionChipPopup();
      popup.querySelectorAll('.style-section').forEach(section=>{
        section.addEventListener('click',(e)=>{
          e.stopPropagation();
          const items=section.nextElementSibling;
          if(!items||!items.classList.contains('style-section-items'))return;
          const arrow=section.querySelector('[data-arrow]');
           if(items.style.display==='none'){items.style.display='';arrow.classList.add('open');}else{items.style.display='none';arrow.classList.remove('open');}
          if(activeChipPopup===popup)repositionChipPopup();
        });
      });
      popup.querySelectorAll('.style-item').forEach(item=>{
        item.addEventListener('click',async()=>{
          const vname=item.dataset.vname;
          const vid=item.dataset.vid;
          await api('POST','/remote/settings',{
            editDefaults:{...currentSettings?.editDefaults,voice:vname},
            voiceClone:{...(currentSettings?.voiceClone||{}),voiceId:vid,profileName:vname}
          });
          currentSettings.editDefaults={...currentSettings?.editDefaults,voice:vname};
          currentSettings.voiceClone={...(currentSettings?.voiceClone||{}),voiceId:vid,profileName:vname};
          renderChips(currentSettings);closeChipPopup();showToast('音色: '+vname);
        });
      });
    });
    return;
  }
  if(type==='style'){
    const popup=document.createElement('div');popup.className='chip-popup';
    popup.innerHTML='<div class="dialog-empty">加载中...</div>';
    positionChipPopup(popup,anchor);
    api('GET','/remote/styles').then(d=>{
      const styles=d?.styles||[];
      if(!styles.length){popup.innerHTML='<div class="dialog-empty">暂无风格，请先在App中学习</div>';return;}
      const cur=currentSettings?.editDefaults?.style||'';
      popup.innerHTML='<ul class="style-list">'+styles.map(s=>'<li class="style-item'+(s.name===cur?' active':'')+'" data-val="'+esc(s.name)+'">'+esc(s.name)+'</li>').join('')+'</ul>';
      if(activeChipPopup===popup)repositionChipPopup();
      popup.querySelectorAll('.style-item').forEach(item=>{
        item.addEventListener('click',async()=>{
          const val=item.dataset.val;
          await api('POST','/remote/settings',{editDefaults:{...currentSettings?.editDefaults,style:val}});
          currentSettings.editDefaults={...currentSettings?.editDefaults,style:val};
          renderChips(currentSettings);closeChipPopup();showToast('风格: '+val);
        });
      });
    });
    return;
  }
  if(type==='more'){
    const popup=document.createElement('div');popup.className='chip-popup';
    const vo=currentSettings?.style?.voiceoverEnabled!==false;
    const sub=vo&&currentSettings?.style?.subtitleEnabled!==false;
    const pub=currentSettings?.publish?.enabled!==false;
    popup.innerHTML='<div class="toggle-row"><span>旁白</span><div class="toggle-switch '+(vo?'on':'')+'" data-toggle-setting="voiceover"></div></div><div class="toggle-row"><span>字幕</span><div class="toggle-switch '+(sub?'on':'')+'" data-toggle-setting="subtitle"'+(vo?'':' style="opacity:.4;pointer-events:none"')+'></div></div><div class="toggle-row"><span>自动发布</span><div class="toggle-switch '+(pub?'on':'')+'" data-toggle-setting="publish"></div></div>';
    positionChipPopup(popup,anchor);
    popup.querySelectorAll('.toggle-switch').forEach(sw=>{
      sw.addEventListener('click',async()=>{
        const k=sw.dataset.toggleSetting;
        let patch;
        if(k==='voiceover'){
          const next=!(currentSettings?.style?.voiceoverEnabled!==false);
          patch={style:{voiceoverEnabled:next,subtitleEnabled:next?(currentSettings?.style?.subtitleEnabled!==false):false}};
        }else if(k==='subtitle'){
          const next=!(currentSettings?.style?.subtitleEnabled!==false);
          patch={style:{subtitleEnabled:next}};
        }else{
          const next=!(currentSettings?.publish?.enabled!==false);
          patch={publish:{enabled:next}};
        }
        await api('POST','/remote/settings',patch);
        currentSettings.style={...(currentSettings?.style||{}),...patch.style};
        if(patch.publish)currentSettings.publish={...(currentSettings?.publish||{}),...patch.publish};
        const vo2=currentSettings?.style?.voiceoverEnabled!==false;
        const sub2=vo2&&currentSettings?.style?.subtitleEnabled!==false;
        const pub2=currentSettings?.publish?.enabled!==false;
        sw.classList.toggle('on',k==='voiceover'?vo2:k==='subtitle'?sub2:pub2);
        if(k==='voiceover'){const subSw=popup.querySelector('[data-toggle-setting="subtitle"]');if(subSw){subSw.style.opacity=vo2?'1':'.4';subSw.style.pointerEvents=vo2?'auto':'none'}}
      });
    });
    return;
  }
  if(type==='speed'){
    const cur=Number(currentSettings?.style?.voiceSpeed??1.1);
    const popup=document.createElement('div');popup.className='chip-popup';
    popup.innerHTML='<div class="slider-row"><span class="slider-label">0.5x</span><input type="range" min="0.5" max="2" step="0.1" value="'+cur+'"><span class="slider-label">2x</span></div><div class="slider-value">'+cur.toFixed(1)+'x</div>';
    positionChipPopup(popup,anchor);
    const range=popup.querySelector('input[type=range]');
    const val=popup.querySelector('.slider-value');
    range.addEventListener('input',()=>{val.textContent=Number(range.value).toFixed(1)+'x'});
    range.addEventListener('change',async()=>{
      const v=Number(range.value);
      await api('POST','/remote/settings',{style:{voiceSpeed:v}});
      currentSettings.style={...(currentSettings?.style||{}),voiceSpeed:v};
      renderChips(currentSettings);closeChipPopup();showToast('语速 '+v.toFixed(1)+'x');
    });
    return;
  }
  if(type==='retry'){
    const cur=Math.max(0,Number(currentSettings?.retry?.failedTaskRetries??0));
    const popup=document.createElement('div');popup.className='chip-popup';
    popup.innerHTML='<div class="slider-row"><span class="slider-label">0</span><input type="range" min="0" max="4" step="1" value="'+cur+'"><span class="slider-label">4</span></div><div class="slider-value">'+(cur===0?'不重试':cur+'次')+'</div>';
    positionChipPopup(popup,anchor);
    const range=popup.querySelector('input[type=range]');
    const val=popup.querySelector('.slider-value');
    range.addEventListener('input',()=>{const v=Number(range.value);val.textContent=v===0?'不重试':v+'次'});
    range.addEventListener('change',async()=>{
      const v=Number(range.value);
      await api('POST','/remote/settings',{retry:{failedTaskRetries:v}});
      currentSettings.retry={failedTaskRetries:v};
      renderChips(currentSettings);closeChipPopup();showToast(v===0?'不重试':'重试 '+v+' 次');
    });
    return;
  }
}

async function checkPlatformLogin(platform){
  const statusEl=document.getElementById('login-status-'+platform);
  const qrEl=document.getElementById('login-qr-'+platform);
  const tipEl=document.getElementById('login-tip');
  if(!statusEl||!qrEl)return;
  document.querySelectorAll('.login-check-btn').forEach(b=>{b.disabled=true;b.style.opacity='0.5';b.style.pointerEvents='none';});
  statusEl.textContent='检测中...';statusEl.className='badge badge-checking';
  qrEl.innerHTML='';if(tipEl)tipEl.style.display='none';
  try{
    const r=await api('POST','/remote/platform-login',{platform});
    if(!r){statusEl.textContent='请求失败';statusEl.className='badge badge-fail';return;}
    if(r.loggedIn){
      statusEl.textContent='已登录';statusEl.className='badge badge-ok';
      qrEl.innerHTML='';if(tipEl)tipEl.style.display='none';
    }else if(r.accountSelection&&r.accounts&&r.accounts.length>0){
      statusEl.textContent='请选择账号';statusEl.className='badge badge-checking';
      let html='<div style="margin-top:var(--space-2)"><div style="font-size:12px;color:var(--muted-foreground);margin-bottom:var(--space-2)">扫码成功，请选择要登录的视频号：</div>';
      r.accounts.forEach(function(a,i){
        html+='<div class="platform-card" style="padding:var(--space-2);margin-bottom:var(--space-2);cursor:pointer" onclick="selectWeixinAccount('+i+')"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600">'+a.name+'</span><span class="badge badge-ok">'+a.role+'</span></div></div>';
      });
      html+='</div>';
      qrEl.innerHTML=html;
      if(tipEl)tipEl.style.display='';
    }else{
      statusEl.textContent='未登录';statusEl.className='badge badge-fail';
      if(r.qrDataUrl){

function getColorHex(p){
  const native=document.getElementById(p+'-native');
  if(native&&native.value) return native.value;
  return '#000000';
}
function setColorFromHex(p,hex){
  if(!hex) hex='#000000';
  if(!/^#[0-9A-Fa-f]{6}$/.test(hex)){
    // 转 3 位 hex
    if(/^#[0-9A-Fa-f]{3}$/.test(hex)) hex='#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3];
    else hex='#000000';
  }
  const native=document.getElementById(p+'-native'); if(native) native.value=hex;
  const hexEl=document.getElementById(p+'-hex'); if(hexEl) hexEl.textContent=hex.toUpperCase();
  updatePreview(p);
}
function updatePreview(p){ const hex=getColorHex(p); const el=document.getElementById(p+'-preview'); if(el) el.style.background=hex; }
function setupColorPicker(p,def){
  setColorFromHex(p,def);
  const native=document.getElementById(p+'-native');
  if(native) native.addEventListener('input',()=>{ setColorFromHex(p,native.value); });
}

async function sendTask(forceItems){

  if(!text&&!(pv.items&&pv.items.length)){showToast('请输入任务');return;}

  input.disabled=true;const btn=document.getElementById('send-btn');if(btn)btn.disabled=true;
  try{
    const body=useItems?{tasks:pv.items.map(t=>({id:t.id,rawLine:t.rawLine,taskName:t.taskName,isOriginal:!!t.isOriginal,videoUrl:t.videoUrl,timeRange:t.timeRange||'',platforms:t.platforms||[],publishCopy:t.publishCopy||'',publishTopics:t.publishTopics||[],campaignName:t.campaignName||'',publishAt:t.publishAt||null})),text}:{text};
    const d=await api('POST','/remote/tasks',body);
    if(d?.ok){
      showToast('已添加 '+(d.tasks?.length||0)+' 个任务');

      loadTasks();
    }else showToast(d?.error||'发送失败');

}

/* ── 主控输入预览（规则识别 / AI 优化） ── */
let preview={count:0,items:[],warnings:[],source:'',defaults:null,error:'',empty:true,mode:'auto'};
let pvTimer=null,pvSeq=0;

function resetPreview(){preview={count:0,items:[],warnings:[],source:'',defaults:null,error:'',empty:true,mode:'auto'};renderPvBar();}

function queueParsePreview(){
  if(pvTimer)clearTimeout(pvTimer);
  pvTimer=setTimeout(()=>{parsePreview(false).catch(()=>{});},180);
}

async function parsePreview(smart){
  const input=document.getElementById('task-input');
  const text=input?.value?.trim()||'';
  const seq=++pvSeq;
  if(!text){resetPreview();return;}
  try{
    const d=await api('POST','/remote/parse',{text,smart});
    if(seq!==pvSeq)return;
    if(d?.ok){
      preview={count:d.tasks?.length||0,items:d.tasks||[],warnings:d.warnings||[],source:d.source||'',defaults:d.defaults||null,error:'',empty:false,mode:smart?'optimized':'auto'};
    }else{
      preview={count:0,items:[],warnings:[],source:'',defaults:null,error:d?.error||'解析失败',empty:false,mode:smart?'optimized':'auto'};
    }
    renderPvBar();
  }catch(e){
    if(seq!==pvSeq)return;
    preview={count:0,items:[],warnings:[],source:'',defaults:null,error:e?.message||'解析失败',empty:false,mode:smart?'optimized':'auto'};
    renderPvBar();
  }
}

async function optimizeTask(){
  const input=document.getElementById('task-input');
  if(!input?.value?.trim()){showToast('请先输入任务');return;}
  const btn=document.getElementById('opt-btn');
  if(btn)btn.classList.add('busy');
  try{
    await parsePreview(true);
    showToast(preview.error?('优化失败: '+preview.error):'已用 AI 优化，可确认发送');
  }catch(e){showToast('优化失败: '+e.message)}
  finally{if(btn)btn.classList.remove('busy')}
}

function renderPvBar(){
  const bar=document.getElementById('pv-bar');if(!bar)return;
  const p=preview;
  if(p.empty||(!p.count&&!p.error)){bar.style.display='none';bar.innerHTML='';return;}
  bar.style.display='flex';
  const srcBadge=p.mode==='optimized'?'<span class="pv-badge ai">AI 优化</span>':(p.source==='ai'?'<span class="pv-badge ai">AI 识别</span>':(p.source==='regex'?'<span class="pv-badge">规则识别</span>':''));
  const d=p.defaults;
  const defTxt=d?('<span class="pv-def">默认：'+(d.platforms||['videoChannel']).map(x=>platformLabel[x]||x).join('+')+' · '+(d.isOriginal?'原创':'不原创')+' · '+(d.topics||[]).length+'个话题'+(d.intervalMinutes?(' · 间隔'+d.intervalMinutes[0]+'-'+d.intervalMinutes[1]+'分'):'')+'</span>'):'';
  const items=(p.items||[]).slice(0,5).map((t,i)=>{
    const pf=(t.platforms||[]).map(x=>platformLabel[x]||x).join('+');
    const tags=['<span class="pv-tag">'+esc(pf)+'</span>','<span class="pv-tag'+(t.isOriginal?' accent':'')+'">'+(t.isOriginal?'原创':'不原创')+'</span>'];
    if(t.publishAt)tags.push('<span class="pv-tag">'+esc(fmtPvTime(t.publishAt))+'</span>');else tags.push('<span class="pv-tag">立即发布</span>');
    if(t.campaignName)tags.push('<span class="pv-tag accent">活动:'+esc(t.campaignName)+'</span>');
    const title=(t.taskName&&t.taskName!=='普通')?'<span class="pv-title">'+esc(t.taskName)+'</span>':'';
    return '<div class="pv-row">'+tags.join('')+title+'</div>';
  }).join('');
  const more=p.count>p.items.length?('<div class="pv-row">…共 '+p.count+' 条</div>'):'';
  const warns=(p.warnings||[]).map(w=>'<div class="pv-warn">'+esc(w)+'</div>').join('');
  const err=p.error?'<div class="pv-warn">'+esc(p.error)+'</div>':'';
  const confirm=(p.items&&p.items.length)?('<div class="pv-acts"><button class="btn btn-sm btn-primary" type="button" id="pv-confirm-btn">'+((p.mode==='optimized')?'确定发送':'发送')+'</button></div>'):'';
  bar.innerHTML='<div class="pv-head">'+srcBadge+'<span class="pv-count">'+p.count+' 条任务</span>'+defTxt+'</div>'+items+more+warns+err+confirm;
  const c=document.getElementById('pv-confirm-btn');
  if(c)c.addEventListener('click',()=>sendTask(true));
}

/* ── 时间线渲染（与 App 主控对齐） ── */

// 从任务/历史 item 提取规则信息（taskSnapshot 优先）
function rulesFromItem(t){
  const snap=t.taskSnapshot||{};
  return {
    platforms:t.platforms||snap.platforms||[],
    isOriginal:t.isOriginal!==undefined?t.isOriginal:snap.isOriginal,
    campaignName:t.campaignName||snap.campaignName,
    publishAt:t.publishAt||snap.publishAt,
    taskName:t.taskName||snap.taskName,
    rawLine:t.rawLine||'',
    videoUrl:t.videoUrl||snap.videoUrl,
    sourceType:t.sourceType||snap.sourceType||'',
    processMode:t.processMode||snap.processMode||'publish',
    _exec:t._exec||null,
    duration:t.duration||0,
    retryCount:t.retryCount||snap.retryCount||0,
  };
}

// 同一任务可能同时来自实时状态、持久化状态和历史记录；不同版本的数据字段也不完全一致。
function taskIdentityParts(item){
  const snap=item&&item.taskSnapshot||{};
  return [item&&item.taskId,snap.id,snap.taskId,item&&item.id]
    .map(v=>String(v==null?'':v).trim()).filter(Boolean);
}

function taskIdentity(item){
  return taskIdentityParts(item)[0]||'';
}

function taskItemAttempt(item){
  const values=[item&&item.attempt,item&&item.retryCount,item&&item.taskSnapshot&&item.taskSnapshot.retryCount];
  for(const value of values){
    const n=Number(value);
    if(Number.isFinite(n)&&n>0)return n;
  }
  return 0;
}

function taskItemTime(item){
  const value=item&&(item.finishedAt||item.updatedAt||item.endedAt||item.createdAt);
  const time=Date.parse(value||'');
  return Number.isFinite(time)?time:0;
}

function shouldKeepTaskItem(candidate,current){
  const attempt=taskItemAttempt(candidate),previousAttempt=taskItemAttempt(current);
  if(attempt!==previousAttempt)return attempt>previousAttempt;
  const time=taskItemTime(candidate),previousTime=taskItemTime(current);
  if(time!==previousTime)return time>=previousTime;
  return Boolean(candidate&&candidate.outputPath)||!Boolean(current&&current.outputPath);
}

function dedupeTaskItems(items){
  const result=[];
  const indexes=new Map();
  (Array.isArray(items)?items:[]).forEach(item=>{
    const key=taskIdentity(item);
    if(!key){result.push(item);return;}
    const index=indexes.get(key);
    if(index===undefined){indexes.set(key,result.length);result.push(item);return;}
    if(shouldKeepTaskItem(item,result[index]))result[index]=item;
  });
  return result;
}

function taskIdsOverlap(item,ids){
  return taskIdentityParts(item).some(id=>ids.has(id));
}

function isTerminalTaskStatus(status){
  return ['completed','warning','failed','stopped','cancelled','canceled'].includes(String(status||''));
}

function formatMsgText(raw){
  if(!raw)return'';
  const lines=String(raw).split(/\r?\n/).filter(l=>l.trim());
  const showNum=lines.length>=3;
  return lines.map((line,i)=>{
    const num=showNum?((i+1)+'、'):'';
    const f=line.replace(/https?:\/\/[^\s,，。；;）)]+/g,shortUrl);
    return num+esc(f);
  }).join('\n');
}

function makeRulesHtml(items){
  const rules=items.map(rulesFromItem);
  const parts=[];
  rules.forEach((t,i)=>{
    const fields=[];
    if(t.platforms&&t.platforms.length)fields.push('<span class="rule-field"><b>'+esc(t.platforms.map(p=>platformLabel[p]||p).join('、'))+'</b></span>');
    if(t.isOriginal)fields.push('<span class="rule-field"><b>原创</b></span>');
    if(t.campaignName)fields.push('<span class="rule-field">活动 <b>'+esc(t.campaignName)+'</b></span>');
    if(t.publishAt){const d=new Date(t.publishAt);if(!isNaN(d))fields.push('<span class="rule-field">定时 <b>'+esc(fmtPvTime(t.publishAt))+'</b></span>');}
    const title=t.videoUrl?shortUrl(t.videoUrl):(t.rawLine||('任务'+(i+1)));
    parts.push('<div class="rule-item"><div class="rule-item-title">'+(i+1)+'. '+esc(title)+'</div><div class="rule-item-fields">'+fields.join('')+'</div></div>');
  });
  const origCount=rules.filter(t=>t.isOriginal).length;
  const platSet=new Set();
  rules.forEach(t=>(t.platforms||[]).forEach(p=>platSet.add(platformLabel[p]||p)));
  const summary='已按规则解析 '+rules.length+' 条任务 · 原创 '+origCount+' · '+[...platSet].join('、');
  return '<div class="msg-rules open"><button type="button" class="msg-rules-head" data-rule-toggle><span class="msg-rules-summary">'+esc(summary)+'</span><span class="msg-rules-arrow">›</span></button><div class="msg-rules-body">'+parts.join('')+'</div></div>';
}

function makeMsgHtml(txt,rules){
  const raw=String(txt||'');
  const escapedRaw=esc(raw).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/`/g,'\\`').replace(/\$/g,'\\$');
  const rulesHtml=(rules&&rules.length)?makeRulesHtml(rules):'';
  return '<div class="msg-content">'+esc(raw)+'</div>'+
    '<div class="msg-actions"><button class="msg-act-btn" type="button" data-msg-copy data-copy="'+escapedRaw+'">复制</button></div>'+
    rulesHtml;
}

function taskCard(t,live){
  const st=t.status||'pending';
  const pg=Math.max(0,Math.min(100,Number(t.progress||0)));
  const idx=t.index||t.queueIndex||0;
  const r=rulesFromItem(t);
  const title=idx?('任务'+idx):(t.taskName&&t.taskName!=='普通'?t.taskName:(r.isOriginal?'原创':'任务'));
  const retrying=t.retryCount>0&&st==='running';
  const badge=retrying?('重试中 ('+t.retryCount+')'):st==='cancelling'?'取消中':statusText(st);
  const isCompleted=st==='completed'||st==='warning';
  const isCancelling=st==='cancelling';
  const msg=t.message?('<div class="task-msg">'+esc(t.message)+'</div>'):'';

  // 元信息行（纯文字标签，无图标）
  const meta=[];
  if(r.sourceType)meta.push('<span class="task-meta-item">'+esc(r.sourceType==='tiktok'?'TikTok':'YouTube')+'</span>');
  if(r.processMode)meta.push('<span class="task-meta-item task-meta-platform">'+esc(monitorModeLabel[r.processMode]||r.processMode)+'</span>');
  if(r.platforms.length)meta.push('<span class="task-meta-item task-meta-platform">'+esc(r.platforms.map(p=>platformLabel[p]||p).join('、'))+'</span>');
  if(r.isOriginal)meta.push('<span class="task-meta-item task-meta-original">原创</span>');
  if(r.campaignName)meta.push('<span class="task-meta-item task-meta-campaign"><b>'+esc(r.campaignName)+'</b></span>');
  if(r.publishAt){const d=new Date(r.publishAt);if(!isNaN(d)){
    const pad=n=>String(n).padStart(2,'0');
    const isExpired=d.getTime()<Date.now();
    if(isExpired&&!isCompleted&&st!=='running'&&st!=='queued')meta.push('<span class="task-meta-item danger">定时已过期 '+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>');
    else meta.push('<span class="task-meta-item task-meta-time">定时 '+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>');
  }}
  const metaHtml=meta.length?('<div class="task-meta">'+meta.join('')+'</div>'):'';

  // 执行详情（耗时/风格/音色/旁白/字幕）
  const exec=r._exec||{};
  const detail=[];
  if(r.sourceType)detail.push('<span class="task-detail-item">来源 <b>'+esc(r.sourceType==='tiktok'?'TikTok':'YouTube')+'</b></span>');
  if(r.processMode)detail.push('<span class="task-detail-item">动作 <b>'+esc(monitorModeLabel[r.processMode]||r.processMode)+'</b></span>');
  if(r.duration>0)detail.push('<span class="task-detail-item">耗时 <b>'+fmtDuration(r.duration)+'</b></span>');
  if(exec.styleName)detail.push('<span class="task-detail-item">风格 <b>'+esc(exec.styleName)+'</b></span>');
  if(exec.voiceName)detail.push('<span class="task-detail-item">音色 <b>'+esc(exec.voiceName)+'</b></span>');
  if(exec.voiceover!==undefined)detail.push('<span class="task-detail-item">旁白 <b>'+(exec.voiceover?'开':'关')+'</b></span>');
  if(exec.subtitle!==undefined)detail.push('<span class="task-detail-item">字幕 <b>'+(exec.subtitle?'开':'关')+'</b></span>');
  const detailHtml=detail.length?('<div class="task-detail"><button type="button" class="task-detail-toggle" data-task-detail>执行详情<span class="td-chevron">›</span></button><div class="task-detail-body"><div class="task-detail-grid">'+detail.join('')+'</div></div></div>'):'';

  const showProgress=live&&['running','preparing','pending','queued'].includes(st);
  const pct=t.history?(st==='failed'?100:0):pg;
  const progressHtml=(showProgress||t.history&&st!=='running'&&st!=='pending'&&st!=='queued')?('<div class="task-bar"><div class="task-bar-in" style="width:'+(t.history?(st==='failed'?'100':'0'):pct)+'%"></div></div>'):'';

  const acts=[];
  if(live&&['queued','pending'].includes(st))acts.push('<button class="task-btn skip" data-action="skip" data-id="'+esc(t.id)+'">跳过</button>');
  if(live&&['running'].includes(st))acts.push('<button class="task-btn cancel" data-action="stop" data-id="'+esc(t.id)+'">取消</button>');
  if((live||t.history)&&['failed','stopped'].includes(st))acts.push('<button class="task-btn" data-action="retry" data-id="'+esc(t.id)+'">重试</button>');
  if(isCompleted&&t.outputPath&&r.processMode==='publish')acts.push('<button class="task-btn" data-action="republish" data-id="'+esc(t.id)+'">重新发布</button>');
  const actsHtml=acts.length?('<div class="task-actions">'+acts.join('')+'</div>'):'';

  const inner='<div class="task-inner"><div class="task-head"><div class="task-title">'+esc(title)+'</div><div class="task-badge">'+esc(badge)+'</div></div>'+metaHtml+detailHtml+progressHtml+msg+actsHtml+'</div>';
  const overlay=isCancelling?'<div class="task-cancelling">取消中...</div>':'';
  return '<div class="task '+esc(st)+'">'+inner+overlay+'</div>';
}

function fmtGroupTime(at){
  if(!at)return '';
  const d=new Date(at);
  if(isNaN(d))return '';
  const pad=n=>String(n).padStart(2,'0');
  const hm=pad(d.getHours())+':'+pad(d.getMinutes());
  const today=new Date();
  if(d.toDateString()===today.toDateString())return hm;
  const yesterday=new Date();yesterday.setDate(today.getDate()-1);
  if(d.toDateString()===yesterday.toDateString())return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function fmtGroupDay(at){
  if(!at)return '';
  const d=new Date(at);
  if(isNaN(d))return '';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

function renderTimeline(){
  const el=document.getElementById('chat-stream'),empty=document.getElementById('empty-state');
  if(!el)return;

  const liveItems=dedupeTaskItems(tasks);

  // 历史按时间倒序处理，同一任务跨 run 重复时保留最新的一份。
  const historySeenIds=new Set();
  const historyGroups=historyRecords
    .map(r=>({txt:r.inputText||'',items:dedupeTaskItems(r.items||[]),at:r.startedAt||r.endedAt||''}))
    .map(g=>({
      ...g,
      items:g.items.filter(item=>{
        const ids=taskIdentityParts(item);
        if(!ids.length)return true;
        if(ids.some(id=>historySeenIds.has(id)))return false;
        ids.forEach(id=>historySeenIds.add(id));
        return true;
      })
    }))
    .filter(g=>g.items.length||g.txt);

  // 终态任务以历史记录为准（历史包含完整规则和最终 attempt），避免实时状态再渲染一张。
  const visibleLiveItems=liveItems.filter(item=>{
    return !(isTerminalTaskStatus(item.status)&&taskIdsOverlap(item,historySeenIds));
  });
  const visibleLiveIds=new Set(visibleLiveItems.flatMap(taskIdentityParts));

  // live 任务按 batchRunId 分组（与 App 对齐）
  const liveGroups=new Map();
  visibleLiveItems.forEach(t=>{
    const g=String(t.batchRunId||taskIdentity(t)||t.id);
    if(!liveGroups.has(g))liveGroups.set(g,{tasks:[],at:t.enqueuedAt||t.updatedAt||new Date().toISOString(),rules:null});
    liveGroups.get(g).tasks.push(t);
  });
  liveGroups.forEach(g=>{g.tasks.sort((a,b)=>(a.index||a.queueIndex||0)-(b.index||b.queueIndex||0));});

  // 运行中的实时卡片优先；只有实时状态仍在展示时，才从历史组中移除同一任务。
  const visibleHistoryGroups=historyGroups.map(g=>({
    ...g,
    items:g.items.filter(item=>!taskIdsOverlap(item,visibleLiveIds))
  })).filter(g=>g.items.length||g.txt);

  if(!liveGroups.size&&!visibleHistoryGroups.length){if(empty)empty.style.display='';return}
  if(empty)empty.style.display='none';

  const parts=[];let day='';
  const group=(at,txt,rulesHtml,tasksHtml)=>{
    const d=fmtGroupDay(at);
    if(d&&d!==day){day=d;parts.push('<div class="chat-day">'+esc(d)+'</div>');}
    parts.push('<div class="run-group"><div class="msg-time">'+esc(fmtGroupTime(at))+'</div>'+
      (txt?('<div class="msg-user">'+makeMsgHtml(txt,rulesHtml!==null?(rulesHtml.items||[]):null)+'</div>'):'')+
      tasksHtml+'</div>');
  };

  visibleHistoryGroups.forEach(g=>{
    const rulesItems=g.items.map(rulesFromItem).filter(x=>x.platforms.length||x.isOriginal||x.campaignName||x.publishAt);
    group(g.at,g.txt,rulesItems.length?{items:g.items}:null,'<div class="task-stack">'+g.items.map(i=>taskCard({...i,id:taskIdentity(i)||i.id||i.taskId,history:true},false)).join('')+'</div>');
  });

  liveGroups.forEach(g=>{
    const txt=g.tasks.map(t=>t.rawLine).filter(Boolean).join('\n');
    const rulesItems=g.tasks.map(rulesFromItem).filter(x=>x.platforms.length||x.isOriginal||x.campaignName||x.publishAt);
    group(g.at,txt,rulesItems.length?{items:g.tasks}:null,'<div class="task-stack">'+g.tasks.map(t=>taskCard(t,true)).join('')+'</div>');
  });

  el.innerHTML=parts.join('');
  const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;
}

if(token){initApp()}else{renderLogin()}
