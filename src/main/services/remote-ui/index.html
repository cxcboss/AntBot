<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>搬运蚁 远程控制</title>
<style>
:root{
  --bg:#09090b;--card:#18181b;--fg:#fafafa;--muted:#a1a1aa;
  --border:#27272a;--primary:#5eead4;--primary-hover:#99f6e4;
  --accent:#134e4a;--accent-fg:#5eead4;
  --destructive:#ef4444;--destructive-bg:#2d1212;
  --success:#22c55e;--warning:#f59e0b;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --shadow:0 4px 6px -1px rgba(0,0,0,.3);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Inter",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);font-size:13px;height:100vh;overflow:hidden}
.header{display:flex;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);height:44px;gap:8px}
.header-title{flex:1;font-size:15px;font-weight:600;text-align:center}
.header-device{font-size:12px;color:var(--accent-fg);cursor:pointer;padding:4px 8px;border-radius:var(--radius);transition:background 120ms}
.header-device:hover{background:var(--accent)}
.nav-icon{width:18px;height:18px}
.nav-item{background:none;border:none;color:var(--fg);cursor:pointer;padding:6px;border-radius:var(--radius);transition:background 120ms;display:flex;align-items:center;gap:6px;font-size:13px}
.nav-item:hover{background:var(--border)}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.sidebar-overlay.show{display:block}
.sidebar{position:fixed;top:0;left:0;width:240px;height:100%;background:var(--card);border-right:1px solid var(--border);z-index:100;transform:translateX(-100%);transition:transform 200ms ease;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:16px;font-size:15px;font-weight:700;border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:8px;display:flex;flex-direction:column;gap:2px}
.sidebar-nav .nav-item{width:100%;padding:10px 12px;border-radius:var(--radius);font-size:13px;justify-content:flex-start}
.sidebar-nav .nav-item.active{background:var(--accent);color:var(--accent-fg)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.sidebar-footer .nav-item{width:100%;color:var(--destructive);justify-content:center;font-size:12px}
.content{height:calc(100vh - 44px);overflow:hidden}
.page{display:none;height:100%;overflow-y:auto;padding:12px}
.page.active{display:block}
#page-main{padding:0;display:none;flex-direction:column}
#page-main.active{display:flex}
#page-subtitle.active,#page-remote.active{display:block}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);font-size:13px;outline:none;transition:border-color 120ms}
.form-input:focus{border-color:var(--primary)}
.btn{padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--fg);transition:all 120ms}
.btn:hover{border-color:var(--primary)}
.btn-primary{background:var(--primary);color:#000;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:none;border:none;color:var(--muted)}
.btn-ghost:hover{color:var(--fg)}
.btn-block{width:100%;display:block}
.btn-sm{padding:4px 10px;font-size:11px;height:28px}
.section-title{font-size:14px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.slider-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slider-label{font-size:11px;color:var(--muted);width:32px;flex-shrink:0}
.slider-val{font-size:11px;color:var(--muted);width:36px;text-align:right;flex-shrink:0}
input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
.slider-h::-webkit-slider-thumb{background:hsl(var(--h,30),100%,50%)!important}
.slider-s::-webkit-slider-thumb{background:hsl(var(--h,30),var(--s,100)%,50%)!important}
.conn-banner{display:none;padding:6px 12px;font-size:11px;text-align:center;gap:6px;align-items:center;justify-content:center}
.conn-banner.show{display:flex}
.conn-banner.ok{background:var(--accent);color:var(--accent-fg)}
.conn-banner.checking,.conn-banner.retry{background:#2d1f0a;color:var(--warning)}
.conn-banner.offline{background:var(--destructive-bg);color:var(--destructive)}
.conn-spinner{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.chat{flex:1;overflow-y:auto;padding:12px}
.chat-stream{display:flex;flex-direction:column;gap:8px}
.input-bar{border-top:1px solid var(--border);padding:8px 12px;background:var(--card);position:sticky;bottom:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.input-field{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--fg);font-size:13px;resize:none;outline:none;max-height:120px;font-family:var(--font);transition:border-color 120ms}
.input-field:focus{border-color:var(--primary)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 120ms}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-fg)}
.task{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px;position:relative}
.task-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.task-name{font-size:12px;font-weight:600}
.task-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:500}
.badge-pending{background:var(--accent);color:var(--accent-fg)}
.badge-running{background:#2d1f0a;color:var(--warning)}
.badge-completed{background:#0a2d12;color:var(--success)}
.badge-warning{background:#2d1f0a;color:var(--warning)}
.badge-failed{background:var(--destructive-bg);color:var(--destructive)}
.task-msg{font-size:11px;color:var(--muted);margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.task-bar-fill{height:100%;background:var(--primary);border-radius:2px;transition:width 300ms}
.task-bar-fill.done{background:var(--success)}
.task-bar-fill.error{background:var(--destructive)}
.task-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.5}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius);font-size:12px;z-index:200;box-shadow:var(--shadow)}
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:200}
.dialog-overlay.show{display:flex}
.dialog{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:24px;width:90%;max-width:320px;box-shadow:var(--shadow)}
.dialog-title{font-size:15px;font-weight:600;margin-bottom:8px}
.dialog-text{font-size:13px;color:var(--muted);margin-bottom:16px}
.dialog-actions{display:flex;gap:8px;justify-content:flex-end}
.exit-menu{position:fixed;top:44px;right:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px;box-shadow:var(--shadow);z-index:150;display:none;min-width:160px}
.exit-menu.show{display:block}
.exit-menu-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius);font-size:13px;color:var(--fg);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background 120ms}
.exit-menu-item:hover{background:var(--border)}
.exit-menu-item.danger{color:var(--destructive)}
.chip-popup{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:6px;box-shadow:var(--shadow);z-index:150;min-width:180px;max-height:280px;overflow-y:auto}
.chip-popup .popup-item{display:block;width:100%;padding:8px 12px;border:none;background:none;color:var(--fg);font-size:13px;text-align:left;cursor:pointer;border-radius:var(--radius);transition:background 120ms}
.chip-popup .popup-item:hover{background:var(--border)}
.chip-popup .popup-item.active{background:var(--accent);color:var(--accent-fg)}
.chip-popup .popup-slider{padding:8px 12px}
.chip-popup .popup-slider label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.chip-popup .popup-slider input[type=range]{width:100%}
.chip-popup .popup-slider .sv{font-size:12px;color:var(--accent-fg);text-align:center;margin-top:4px}
.chip-overlay{position:fixed;inset:0;z-index:149}
</style>
</head>
<body>
<div id="app"></div>
<script>
const HUB_URL='https://hub.onebugmanai.online';
let API=window.location.origin;
let token=localStorage.getItem('antbot-token');
let tasks=[];
let sseSource=null;
let currentPage='main';
let userPassword=localStorage.getItem('antbot-pass')||'';
let deviceName=localStorage.getItem('antbot-device')||'';
let consecutiveErrors=0;
let reconnectTimer=null;

// 从 URL 参数获取 Hub 传递的 token 和设备名
const urlParams=new URLSearchParams(window.location.search);
const hubToken=urlParams.get('hub_token');
const hubDevice=urlParams.get('device_name');
if(hubToken){
  token=hubToken;
  localStorage.setItem('antbot-token',token);
  if(hubDevice){deviceName=hubDevice;localStorage.setItem('antbot-device',deviceName);}
  // 清除 URL 参数
  window.history.replaceState({},'',window.location.pathname);
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function login(password){
  try{
    const res=await fetch(API+'/remote/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password})});
    const data=await res.json();
    if(data.ok){
      token=data.token;userPassword=password;
      localStorage.setItem('antbot-token',token);
      localStorage.setItem('antbot-pass',password);
      initApp();
    }else{showToast(data.error||'登录失败')}
  }catch(e){showToast('网络错误')}
}

function logout(){
  token=null;userPassword='';
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  localStorage.removeItem('antbot-pass');
  renderLogin();
}

function exitToHub(){
  token=null;userPassword='';
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(sseSource)sseSource.close();
  localStorage.removeItem('antbot-token');
  localStorage.removeItem('antbot-pass');
  localStorage.removeItem('antbot-device');
  window.location.href=HUB_URL;
}

async function api(method,path,body){
  const opts={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
  if(body)opts.body=JSON.stringify(body);
  const res=await fetch(API+'/remote'+path,opts);
  if(res.status===401){logout();return null;}
  return res.json();
}

function showToast(msg,dur){
  const old=document.querySelector('.toast');if(old)old.remove();
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),dur||3000);
}

function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null;}
  sseSource=new EventSource(API+'/remote/events?token='+token);
  sseSource.onopen=()=>{consecutiveErrors=0;hideBanner()};
  sseSource.addEventListener('task-update',e=>{
    const t=JSON.parse(e.data);const i=tasks.findIndex(x=>x.id===t.id);
    if(i>=0)tasks[i]={...tasks[i],...t};else tasks.push(t);
    renderTasks();
  });
  sseSource.addEventListener('status',e=>{
    const s=JSON.parse(e.data);
    if(s.tasks){tasks=s.tasks;renderTasks();}
  });
  sseSource.addEventListener('settings-update',e=>{
    const patch=JSON.parse(e.data);
    if(currentSettings){
      if(patch.editDefaults)currentSettings.editDefaults={...currentSettings.editDefaults,...patch.editDefaults};
      if(patch.voiceClone)currentSettings.voiceClone={...currentSettings.voiceClone,...patch.voiceClone};
      if(patch.retry)currentSettings.retry={...currentSettings.retry,...patch.retry};
      renderChips(currentSettings);
    }
  });
  sseSource.onerror=()=>{
    consecutiveErrors++;
    if(consecutiveErrors>=3){showBanner('retry');reconnectViaHub();}
    else if(consecutiveErrors>=1){showBanner('checking')}
  };
}

async function reconnectViaHub(){
  if(reconnectTimer)clearTimeout(reconnectTimer);
  if(!deviceName)return;
  try{
    const res=await fetch(HUB_URL+'/api/devices');
    const data=await res.json();
    if(data.ok){
      const dev=data.devices.find(d=>d.deviceName===deviceName);
      if(dev&&dev.tunnelUrl&&dev.tunnelUrl!==API){
        showBanner('newurl');API=dev.tunnelUrl;
        setTimeout(()=>{const sep=API.includes('?')?'&':'?';window.location.href=API+sep+'hub_token='+(token||'')+'&device_name='+encodeURIComponent(deviceName)},1500);
        return;
      }
    }
  }catch{}
  showBanner('offline');
  reconnectTimer=setTimeout(reconnectViaHub,15000);
}

function showBanner(st){
  const b=document.getElementById('conn-banner');if(!b)return;
  b.className='conn-banner show '+st;
  const t=document.getElementById('conn-text');
  const msgs={checking:'连接中断，正在检查...',retry:'连接中断，重连中...',newurl:'服务器已更新，正在跳转...',offline:'电脑可能已离线'};
  if(t)t.textContent=msgs[st]||'正在连接...';
}
function hideBanner(){const b=document.getElementById('conn-banner');if(b){b.className='conn-banner show ok';const t=document.getElementById('conn-text');if(t)t.textContent='已连接';setTimeout(()=>{b.className='conn-banner'},2000);}}

function renderLogin(){
  document.getElementById('app').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;padding:24px">'+
    '<div style="width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px 24px;box-shadow:var(--shadow)">'+
    '<div style="text-align:center;font-size:18px;font-weight:700;margin-bottom:4px">搬运蚁远程控制</div>'+
    (deviceName?'<div style="text-align:center;font-size:13px;color:var(--accent-fg);margin-bottom:20px">'+esc(deviceName)+'</div>':'<div style="text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px">输入密码连接到设备</div>')+
    '<form id="login-form">'+
    '<div style="margin-bottom:16px"><input class="form-input" id="login-pass" type="password" placeholder="访问密码" autocomplete="current-password" style="width:100%"></div>'+
    '<button class="btn btn-primary btn-block" type="submit">连接</button>'+
    '</form><div id="login-error" style="color:var(--destructive);font-size:12px;text-align:center;margin-top:8px"></div>'+
    '</div></div>';
  document.getElementById('login-form').addEventListener('submit',e=>{
    e.preventDefault();
    const p=document.getElementById('login-pass').value.trim();
    if(!p){document.getElementById('login-error').textContent='请输入密码';return;}
    login(p);
  });
  document.getElementById('login-pass')?.focus();
}

function initApp(){
  document.getElementById('app').innerHTML=renderAppShell();
  bindEvents();
  loadSettings();
  loadTasks();
  connectSSE();
}

function renderAppShell(){
  const h=`
<div class="header">
  <button class="nav-item" id="sidebar-toggle" style="width:auto;padding:6px;flex-shrink:0"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg></button>
  <span class="header-title" id="header-title">主控</span>
  <span class="header-device" id="header-device">${esc(deviceName||'设备')}</span>
</div>
<div class="conn-banner" id="conn-banner"><span class="conn-spinner"></span><span id="conn-text"></span></div>
<div class="exit-menu" id="exit-menu">
  <button class="exit-menu-item danger" id="exit-btn">退出到设备列表</button>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">搬运蚁</div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-page="main"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>主控</button>
    <button class="nav-item" data-page="subtitle"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>字幕</button>
    <button class="nav-item" data-page="remote"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>远程</button>
  </nav>
</div>
<div class="content" id="content">
  <div class="page active" id="page-main">
    <div class="chat" id="chat"><div class="chat-stream" id="chat-stream"><div class="empty" id="empty-state"><div class="empty-icon">📋</div><div>粘贴视频链接开始下载</div></div></div></div>
  </div>
  <div class="page" id="page-subtitle">
    <div class="form-group"><label class="form-label">字幕颜色</label>
      <div style="width:100%;height:28px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px" id="color-preview"></div>
      <div class="slider-row"><span class="slider-label">色相</span><input type="range" id="color-h" min="0" max="360" value="30" class="slider-h"><span class="slider-val" id="color-h-val">30°</span></div>
      <div class="slider-row"><span class="slider-label">饱和</span><input type="range" id="color-s" min="0" max="100" value="100" class="slider-s"><span class="slider-val" id="color-s-val">100%</span></div>
      <div class="slider-row"><span class="slider-label">亮度</span><input type="range" id="color-l" min="0" max="100" value="50" class="slider-l"><span class="slider-val" id="color-l-val">50%</span></div>
    </div>
    <div class="form-group"><label class="form-label">描边颜色</label>
      <div style="width:100%;height:28px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:8px" id="stroke-preview"></div>
      <div class="slider-row"><span class="slider-label">色相</span><input type="range" id="stroke-h" min="0" max="360" value="0" class="slider-h"><span class="slider-val" id="stroke-h-val">0°</span></div>
      <div class="slider-row"><span class="slider-label">饱和</span><input type="range" id="stroke-s" min="0" max="100" value="0" class="slider-s"><span class="slider-val" id="stroke-s-val">0%</span></div>
      <div class="slider-row"><span class="slider-label">亮度</span><input type="range" id="stroke-l" min="0" max="100" value="0" class="slider-l"><span class="slider-val" id="stroke-l-val">0%</span></div>
    </div>
    <div class="form-group"><label class="form-label">字幕位置 (0-100)</label><input class="form-input" id="sub-position" type="number" min="0" max="100" value="12" /></div>
    <button class="btn btn-primary btn-block" id="sub-save-btn" type="button">保存设置</button>
  </div>
  <div class="page" id="page-remote">
    <div class="section-title">远程设置</div>
    <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="remote-pass" type="password" /></div>
    <button class="btn btn-primary btn-block" id="remote-save-btn" type="button">保存并重新登录</button>
  </div>
</div>
<div class="input-bar" id="input-bar">
  <div class="input-row">
    <textarea class="input-field" id="task-input" placeholder="粘贴视频链接..." rows="1"></textarea>
    <button class="send-btn" id="send-btn" type="button" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
  </div>
  <div class="chips" id="chips"></div>
</div>`;
  return h;
}

function bindEvents(){
  // 设备名点击 → 退出菜单
  document.getElementById('header-device')?.addEventListener('click',e=>{
    e.stopPropagation();
    const menu=document.getElementById('exit-menu');
    menu?.classList.toggle('show');
  });
  document.addEventListener('click',()=>{
    document.getElementById('exit-menu')?.classList.remove('show');
  });
  document.getElementById('exit-btn')?.addEventListener('click',exitToHub);

  document.getElementById('sidebar-toggle')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('show');
  });
  document.getElementById('sidebar-overlay')?.addEventListener('click',()=>{
    document.getElementById('sidebar')?.classList.remove('open');
    document.getElementById('sidebar-overlay')?.classList.remove('show');
  });
  document.querySelectorAll('.nav-item[data-page]').forEach(btn=>{
    btn.addEventListener('click',()=>switchPage(btn.dataset.page));
  });
  const input=document.getElementById('task-input');
  const sendBtn=document.getElementById('send-btn');
  if(input){
    if(sendBtn)sendBtn.disabled=!input.value.trim();
    input.addEventListener('input',()=>{
      input.style.height='auto';
      input.style.height=Math.min(input.scrollHeight,120)+'px';
      if(sendBtn)sendBtn.disabled=!input.value.trim();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTask();}});
  }
  if(sendBtn)sendBtn.addEventListener('click',sendTask);
  document.getElementById('chat-stream')?.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn)return;
    if(btn.dataset.action==='stop')api('POST','/tasks/'+btn.dataset.id+'/stop').then(()=>showToast('已停止'));
    if(btn.dataset.action==='retry')api('POST','/tasks/'+btn.dataset.id+'/retry').then(()=>showToast('已重试'));
  });
  document.getElementById('sub-save-btn')?.addEventListener('click',async()=>{
    await api('POST','/remote/settings',{style:{subtitleTextColor:getColorHex('color'),subtitleStrokeColor:getColorHex('stroke'),subtitlePositionPercent:parseInt(document.getElementById('sub-position')?.value)||12}});
    showToast('已保存并同步');
  });
  document.getElementById('remote-save-btn')?.addEventListener('click',async()=>{
    const p=document.getElementById('remote-pass')?.value?.trim();
    if(!p){showToast('请设置密码');return;}
    await api('POST','/remote/settings',{remote:{password:p}});
    showToast('已保存，需重新登录');setTimeout(logout,1000);
  });
  setupColorPicker('color','#FFA100');
  setupColorPicker('stroke','#000000');
}

function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('.nav-item[data-page]').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  document.getElementById('header-title').textContent={main:'主控',subtitle:'字幕',remote:'远程'}[page]||'主控';
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('show');
  const ib=document.getElementById('input-bar');if(ib)ib.style.display=page==='main'?'':'none';
  if(page==='subtitle')loadSubtitleSettings();
  if(page==='remote')loadRemoteSettings();
}

async function loadSettings(){const d=await api('GET','/remote/settings');if(d){currentSettings=d;renderChips(d);}}
let currentSettings=null;
let activePopup=null;let activeOverlay=null;
function closePopup(){if(activePopup){activePopup.remove();activePopup=null}if(activeOverlay){activeOverlay.remove();activeOverlay=null}}
function renderChips(s){
  const c=document.getElementById('chips');if(!c)return;
  const style=s?.editDefaults?.style||'未设置';
  const voice=s?.voiceClone?.profileName||'未设置';
  const retry=Math.max(0,Number(s?.retry?.failedTaskRetries??0));
  c.innerHTML='<button class="chip" data-chip="style">'+esc(style)+'</button>'
    +'<button class="chip" data-chip="voice">'+esc(voice)+'</button>'
    +'<span class="chip-spacer"></span>'
    +'<button class="chip" data-chip="retry">重试'+retry+'次</button>';
  c.querySelectorAll('[data-chip]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();showChipPopup(btn.dataset.chip,btn)});
  });
}
function showChipPopup(type,anchor){
  closePopup();
  const overlay=document.createElement('div');overlay.className='chip-overlay';
  overlay.addEventListener('click',closePopup);
  document.body.appendChild(overlay);activeOverlay=overlay;
  const popup=document.createElement('div');popup.className='chip-popup';
  const rect=anchor.getBoundingClientRect();
  popup.style.left=Math.max(8,rect.left)+'px';
  popup.style.bottom=(window.innerHeight-rect.top+6)+'px';
  popup.style.maxHeight=Math.min(280,rect.top-20)+'px';

  if(type==='style'){
    popup.innerHTML='<div style="padding:6px 12px;font-size:11px;color:var(--muted)">加载中...</div>';
    document.body.appendChild(popup);activePopup=popup;
    api('GET','/remote/styles').then(d=>{
      const styles=d?.styles||[];
      if(!styles.length){popup.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--muted)">暂无风格，请先在App中学习</div>';return;}
      const cur=currentSettings?.editDefaults?.style||'';
      popup.innerHTML=styles.map(s=>'<button class="popup-item'+(s.name===cur?' active':'')+'" data-val="'+esc(s.name)+'">'+esc(s.name)+'</button>').join('');
      popup.querySelectorAll('.popup-item').forEach(btn=>{
        btn.addEventListener('click',async()=>{
          const val=btn.dataset.val;
          await api('POST','/remote/settings',{editDefaults:{...currentSettings?.editDefaults,style:val}});
          currentSettings.editDefaults={...currentSettings?.editDefaults,style:val};
          renderChips(currentSettings);closePopup();showToast('风格: '+val);
        });
      });
    });
    return;
  }

  if(type==='voice'){
    popup.innerHTML='<div style="padding:6px 12px;font-size:11px;color:var(--muted)">加载中...</div>';
    document.body.appendChild(popup);activePopup=popup;
    api('GET','/remote/voices').then(d=>{
      const voices=d?.voices||[];
      if(!voices.length){popup.innerHTML='<div style="padding:8px 12px;font-size:12px;color:var(--muted)">暂无音色，请先在App中克隆</div>';return;}
      const cur=currentSettings?.voiceClone?.voiceId||'';
      popup.innerHTML=voices.map(v=>'<button class="popup-item'+(v.id===cur?' active':'')+'" data-vid="'+esc(v.id)+'" data-vname="'+esc(v.name)+'">'+esc(v.name)+'</button>').join('');
      popup.querySelectorAll('.popup-item').forEach(btn=>{
        btn.addEventListener('click',async()=>{
          const vid=btn.dataset.vid,vname=btn.dataset.vname;
          await api('POST','/remote/settings',{voiceClone:{...currentSettings?.voiceClone,voiceId:vid,profileName:vname}});
          currentSettings.voiceClone={...currentSettings?.voiceClone,voiceId:vid,profileName:vname};
          renderChips(currentSettings);closePopup();showToast('音色: '+vname);
        });
      });
    });
    return;
  }

  if(type==='retry'){
    const cur=Math.max(0,Number(currentSettings?.retry?.failedTaskRetries??0));
    popup.innerHTML='<div class="popup-slider"><label>重试次数</label><input type="range" min="0" max="4" step="1" value="'+cur+'"><div class="sv">'+(cur===0?'不重试':cur+'次')+'</div></div>';
    document.body.appendChild(popup);activePopup=popup;
    const range=popup.querySelector('input[type=range]');
    const val=popup.querySelector('.sv');
    range.addEventListener('input',()=>{const v=Number(range.value);val.textContent=v===0?'不重试':v+'次'});
    range.addEventListener('change',async()=>{
      const v=Number(range.value);
      await api('POST','/remote/settings',{retry:{failedTaskRetries:v}});
      currentSettings.retry={failedTaskRetries:v};
      renderChips(currentSettings);closePopup();showToast(v===0?'不重试':'重试 '+v+' 次');
    });
    return;
  }
}
async function loadSubtitleSettings(){
  const d=await api('GET','/remote/settings');if(!d)return;const s=d?.style||{};
  setColorFromHex('color',s.subtitleTextColor||'#FFA100');setColorFromHex('stroke',s.subtitleStrokeColor||'#000000');
  const el=document.getElementById('sub-position');if(el)el.value=s.subtitlePositionPercent??12;
}
async function loadRemoteSettings(){
  const d=await api('GET','/remote/credentials');if(!d)return;
  const p=document.getElementById('remote-pass');if(p)p.value=d.password||'';
}

function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0')};return '#'+f(0)+f(8)+f(4)}
function hexToHsl(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];const r=parseInt(hex.substring(0,2),16)/255,g=parseInt(hex.substring(2,4),16)/255,b=parseInt(hex.substring(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=((g-b)/d+(g<b?6:0))/6;else if(mx===g)h=((b-r)/d+2)/6;else h=((r-g)/d+4)/6}return{h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)}}
function getColorHex(p){const h=parseInt(document.getElementById(p+'-h')?.value||0),s=parseInt(document.getElementById(p+'-s')?.value||0),l=parseInt(document.getElementById(p+'-l')?.value||50);return hslToHex(h,s,l)}
function setColorFromHex(p,hex){const c=hexToHsl(hex);['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el){el.value=c[t];const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=c[t]+(t==='h'?'°':'%')}});updatePreview(p)}
function updatePreview(p){const hex=getColorHex(p);const el=document.getElementById(p+'-preview');if(el)el.style.background=hex}
function setupColorPicker(p,def){setColorFromHex(p,def);['h','s','l'].forEach(t=>{const el=document.getElementById(p+'-'+t);if(el)el.addEventListener('input',()=>{const v=document.getElementById(p+'-'+t+'-val');if(v)v.textContent=el.value+(t==='h'?'°':'%');updatePreview(p)})})}

async function loadTasks(){
  const d=await api('GET','/remote/tasks');if(d?.tasks)tasks=d.tasks;
  try{const h=await api('GET','/remote/history');if(h?.history)for(const r of h.history)if(r.items)for(const i of r.items)if(!tasks.find(t=>t.id===i.id))tasks.push({...i,_h:1})}catch{}
  renderTasks();
}
async function sendTask(){
  const input=document.getElementById('task-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  input.disabled=true;const btn=document.getElementById('send-btn');if(btn)btn.disabled=true;
  try{const d=await api('POST','/tasks',{text});if(d?.ok){showToast('已添加 '+(d.tasks?.length||0)+' 个任务');input.value='';input.style.height='auto'}else showToast(d?.error||'发送失败')}catch{showToast('网络错误')}
  input.disabled=false;if(btn)btn.disabled=false;input.focus();
}
function renderTasks(){
  const el=document.getElementById('chat-stream'),empty=document.getElementById('empty-state');
  if(!el)return;if(!tasks.length){if(empty)empty.style.display='';return}
  if(empty)empty.style.display='none';
  const sorted=[...tasks].sort((a,b)=>(a.index||a.queueIndex||0)-(b.index||b.queueIndex||0));
  el.innerHTML=sorted.map(t=>{
    const st=t.status||'pending',pg=Math.max(0,Math.min(100,Number(t.progress||0)));
    const idx=t.index||t.queueIndex||0;
    const name=idx?'任务'+idx:(t.isOriginal?'原创':(t.taskName||'任务'));
    const bc={running:'badge-running',completed:'badge-completed',warning:'badge-warning',failed:'badge-failed'}[st]||'badge-pending';
    const bt={pending:'等待',queued:'等待',running:'执行中',completed:'成功',warning:'部分完成',failed:'失败',stopped:'已停止'}[st]||st;
    const barC=st==='completed'?'done':st==='failed'?'error':'';
    const msg=t.message||'';
    let acts='';
    if(st==='failed')acts+='<button class="btn btn-ghost btn-sm" data-action="retry" data-id="'+t.id+'">重试</button>';
    if(['pending','queued','running'].includes(st))acts+='<button class="btn btn-ghost btn-sm" data-action="stop" data-id="'+t.id+'">停止</button>';
    return '<div class="task"><div class="task-head"><span class="task-name">'+esc(name)+'</span><span class="task-badge '+bc+'">'+bt+'</span></div>'+
      (t.isOriginal?'<div style="margin-top:4px"><span style="font-size:10px;padding:1px 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg)">原创</span></div>':'')+
      (msg?'<div class="task-msg">'+esc(msg)+'</div>':'')+
      '<div class="task-bar"><div class="task-bar-fill '+barC+'" style="width:'+pg+'%"></div></div>'+
      (acts?'<div class="task-actions">'+acts+'</div>':'')+'</div>';
  }).join('');
  const chat=document.getElementById('chat');if(chat)chat.scrollTop=chat.scrollHeight;
}

if(token){initApp()}else{renderLogin()}
